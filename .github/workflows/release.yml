# Release pipeline: tag → signed + notarized arm64 artifacts → GitHub Release → Homebrew tap.
#
# ⚠ THIS REPO IS PUBLIC — every line this workflow prints is public. The one step that touches
# signing material masks each value with `::add-mask::` BEFORE anything can echo it, and never
# crosses a step boundary with a secret in `$GITHUB_ENV`. Keep it that way.
#
# WHY the credentials come from better-update and not GitHub secrets: the Developer ID identity
# belongs to WEEBUILD VIET NAM and is shared with other products; it lives once in the
# better-update E2E vault (org `weebuild`) and every pipeline pulls it from there. The ONLY
# GitHub secret is BETTER_UPDATE_ROBOT — the robot token that unlocks the vault. Setup and the
# full variable list: docs/49-release-pipeline.md.
#
# ARM64 ONLY. The apps deploy against macOS 26, which no Intel Mac runs, and the tap's formula and
# cask both declare `depends_on arch: :arm64` (docs/49 reasons 2 and 3 — either alone is
# sufficient). There is deliberately no x86_64 matrix leg.
name: Release

run-name: "Release ${{ inputs.version || github.ref_name }}${{ inputs.dry-run && ' (dry run)' || '' }}"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to build, no leading v (e.g. 0.1.0)
        type: string
        required: true
      dry-run:
        description: "Dry run — DOES Developer-ID sign, then stops: no notarization, no Release, no tap bump"
        type: boolean
        default: true

# One release at a time. Never cancel an in-flight notarization — Apple bills the submission
# either way and a cancelled staple leaves a signed-but-unstapled artifact behind.
concurrency: release

permissions: {}

jobs:
  # ── build + sign + notarize ───────────────────────────────────────────────────────────────
  # There used to be a `libghostty` job ahead of this one, split out and cached because it was the
  # slow, fragile half: a pinned Zig 0.15.2 toolchain, a fork clone that could not link the macOS 26
  # SDK, a Metal shader compile, and a `zig build` that was EXPECTED to exit non-zero. The fork is
  # gone (docs/68), so the pipeline is one job again — the terminal engine is a crate the FFI step
  # below already builds, and it takes its ghostty source from the commit `ThirdParty/tools/tools.lock`
  # pins rather than from a clone this workflow has to perform.
  package:
    name: Build, sign, notarize
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "${version}" in
            v*) echo "::error::version must not carry a leading v: ${version}"; exit 1 ;;
            "") echo "::error::empty version"; exit 1 ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Fail in seconds rather than after a ~20-minute signed, notarized build. The publish
      # job needs this section to exist; discovering that at the END of the pipeline means
      # a tag that burned a notarization round trip and still cannot be released.
      - name: Check the changelog has a section for this version
        run: |
          cargo run --release --quiet --manifest-path rust/slopdesk-devtools/Cargo.toml \
            --bin slopdesk-release -- changelog section "${{ steps.version.outputs.version }}" > /dev/null

      # The ONE linked artifact, and the pipeline did not know about it. `Package.swift` declares a
      # `binaryTarget` at `ThirdParty/slopdesk-ffi/SlopDeskFFI.xcframework`, that path is gitignored
      # (110 MB for the three slices, rewritten by every Rust edit — `slopdesk-devtools`'
      # `gates::ffi` explains the choice), and no step here built it: SwiftPM cannot resolve the
      # graph at all without the file, so the first tag cut after the FFI work lands would fail
      # before it compiled a line. It never bit because the whole port was still uncommitted, which
      # is exactly the window in which to notice. No cache: the gate stamps its own inputs and a
      # runner is cold every time regardless.
      #
      # `just ffi` rather than a script path, and `linked-artifacts-are-built` in
      # `rust/slopdesk-invariants` is what keeps this step honest: it derives the producer from the
      # justfile recipe whose DOC names the artifact, and fails if this workflow stops running it.
      #
      # `just` is installed here rather than assumed. The runner image ships `make` and does not ship
      # `just`, which is the one thing the move off make costs a cold machine — and a recipe runner
      # that is missing fails this step with "command not found" minutes before anything is signed.
      - name: Build SlopDeskFFI.xcframework
        run: |
          set -euo pipefail
          brew install just
          rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
          just ffi

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          # The macos-26 image ships `aws/tap` already tapped, and Homebrew now refuses formulae
          # from untrusted taps — printing a 12-line trust warning on EVERY brew invocation. We
          # install xcodegen from homebrew/core and never touch that tap, so drop it rather than
          # granting trust we do not need (or setting HOMEBREW_NO_REQUIRE_TAP_TRUST, which brew
          # says it will remove). `|| true`: a future image that stops shipping it must not fail.
          brew untap aws/tap || true
          brew install xcodegen

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ONE step for everything that touches signing material: pull → mask → source → sign.
      # Nothing secret crosses a step boundary, so nothing can leak through $GITHUB_ENV or a
      # later step's `set -x`.
      - name: Build, sign and notarize
        env:
          BETTER_UPDATE_ROBOT: ${{ secrets.BETTER_UPDATE_ROBOT }}
          SLOPDESK_VERSION: ${{ steps.version.outputs.version }}
          SLOPDESK_BUILD_NUMBER: ${{ github.run_number }}
          SLOPDESK_SKIP_NOTARIZE: ${{ inputs.dry-run && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 077

          # @latest, with --minimum-release-age=0 as a required companion rather than decoration:
          # bun holds back same-day publishes by default, so @latest can quietly resolve to a
          # build older than the server's >0.72.0 floor — the very reason this used to be pinned.
          # Disabling the hold-back is what makes @latest actually mean latest.
          bun add -g @better-update/cli@latest --minimum-release-age=0
          vault="${RUNNER_TEMP}/vault.sh"
          better-update env pull --environment production --stdout > "${vault}"

          # Mask FIRST. `env pull --stdout` emits `export KEY='value'` lines; a value that
          # reaches the log before its mask is registered is public forever.
          while IFS= read -r line; do
            case "${line}" in export\ *) ;; *) continue ;; esac
            value="${line#*=}"
            value="${value#\'}"
            value="${value%\'}"
            [ -n "${value}" ] && echo "::add-mask::${value}"
          done < "${vault}"

          # shellcheck disable=SC1090
          . "${vault}"
          rm -f "${vault}"

          # A throwaway keychain, unlocked for this job only. The runner is ephemeral, but a
          # default-keychain swap would still outlive the step on a self-hosted box.
          keychain="${RUNNER_TEMP}/slopdesk-build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 7200 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          # PREPEND to the search list rather than replacing it: `security create-keychain` does
          # not add the keychain, and `-s "${keychain}"` alone would evict the login keychain the
          # Xcode toolchain still reads from.
          existing="$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "${keychain}" ${existing}

          p12="${RUNNER_TEMP}/developer-id.p12"
          printf '%s' "${APPLE_CERTIFICATE_P12_BASE64}" | base64 --decode > "${p12}"
          security import "${p12}" -k "${keychain}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${p12}"
          # Without this, codesign blocks on a UI prompt that no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}" > /dev/null

          cargo run --release --quiet --manifest-path rust/slopdesk-devtools/Cargo.toml \
            --bin slopdesk-release -- package

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slopdesk-${{ steps.version.outputs.version }}-arm64
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 7

  # ── publish ───────────────────────────────────────────────────────────────────────────────
  publish:
    name: GitHub Release
    needs: package
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out for ONE file: CHANGELOG.md, which carries the notes this job posts.
      # It must come before download-artifact — checkout cleans the workspace it lands in.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: slopdesk-${{ needs.package.outputs.version }}-arm64
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail

          # The notes are the CHANGELOG.md section for this version — generated from the
          # commit log by git-cliff when the release was cut (`slopdesk-release cut-release`),
          # so they cannot drift from what shipped. This is the only part of the body that
          # differs between versions; without it a reader learns the same nothing from
          # v0.2.1 and v0.2.2.
          #
          # A missing section FAILS the job. The alternative is publishing the boilerplate
          # under a version that silently has no notes, which is the bug being fixed here.
          #
          # Assembled in RUNNER_TEMP, not in the checkout. A scratch `changelog.md` beside
          # the repo's `CHANGELOG.md` is one case-insensitive filesystem away from the
          # redirect truncating the file this job exists to read — it does exactly that on
          # macOS, and `runs-on` is one line of config.
          # THE BODY IS THE CHANGELOG SLICE AND NOTHING ELSE. It used to carry Install,
          # Requirements, Signing and a Checksums block underneath — four sections that were
          # byte-identical in every release, so they were pure repetition the moment there was
          # a second one, and each already has a home that stays current on its own:
          #
          #   Install / Requirements  → README.md
          #   Signing                 → docs/49-release-pipeline.md
          #   Checksums               → the SHA256SUMS asset attached to this release
          #
          # A release note answers one question — what changed — and the sections that do not
          # answer it push the part that does off the first screen.
          notes="${RUNNER_TEMP}/release-notes.md"
          cargo run --release --quiet --manifest-path rust/slopdesk-devtools/Cargo.toml \
            --bin slopdesk-release -- changelog section "${VERSION}" > "${notes}"

          # Re-running a release (a re-tag, a retried job) must not fail on an existing
          # release — and must REFRESH the notes, not leave the first attempt's body behind.
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --notes-file "${notes}"
            gh release upload "v${VERSION}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "v${VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SlopDesk ${VERSION}" \
              --notes-file "${notes}" \
              dist/*
          fi

  # ── Homebrew tap ──────────────────────────────────────────────────────────────────────────
  tap:
    name: Bump aislopware/homebrew-tap
    needs: [package, publish]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      # BEFORE download-artifact: the vault client resolves the project from the top-level
      # `projectId` in eas.json (docs/49), so it needs the repo in the working directory —
      # without it `env pull` exits 4 with "Project not linked" and never reaches the token.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: slopdesk-${{ needs.package.outputs.version }}-arm64
          path: dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pull the tap token from the vault and push the bump
        env:
          BETTER_UPDATE_ROBOT: ${{ secrets.BETTER_UPDATE_ROBOT }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          umask 077

          # @latest, with --minimum-release-age=0 as a required companion rather than decoration:
          # bun holds back same-day publishes by default, so @latest can quietly resolve to a
          # build older than the server's >0.72.0 floor — the very reason this used to be pinned.
          # Disabling the hold-back is what makes @latest actually mean latest.
          bun add -g @better-update/cli@latest --minimum-release-age=0

          # Same pull-mask-source shape as the package job. `env get` renders a table for a
          # human; only `env pull --stdout` emits machine-readable `export KEY='value'` lines.
          vault="${RUNNER_TEMP}/vault.sh"
          better-update env pull --environment production --stdout > "${vault}"
          while IFS= read -r line; do
            case "${line}" in export\ *) ;; *) continue ;; esac
            value="${line#*=}"
            value="${value#\'}"
            value="${value%\'}"
            [ -n "${value}" ] && echo "::add-mask::${value}"
          done < "${vault}"
          # shellcheck disable=SC1090
          . "${vault}"
          rm -f "${vault}"
          token="${HOMEBREW_TAP_TOKEN:?HOMEBREW_TAP_TOKEN is not in the better-update vault}"

          dmg_sha="$(awk '/\.dmg$/ {print $1}' dist/SHA256SUMS)"
          cli_sha="$(awk '/\.tar\.gz$/ {print $1}' dist/SHA256SUMS)"

          git clone --depth 1 "https://x-access-token:${token}@github.com/aislopware/homebrew-tap.git" tap

          # COPY, then rewrite two lines. The tap used to be edited in place, which meant the
          # formula in it was whatever the last hand-edit left — and for four releases that was a
          # `bin.install` naming three of the twelve binaries, so a `brew install` had no superd and
          # therefore a host that could not open a pane. `packaging/homebrew/` is the source of
          # truth now, `rust/slopdesk-invariants` derives its install list from the release binary's tool table, and
          # this job's only remaining freedom is the version and the two SHAs.
          cp packaging/homebrew/Formula/slopdesk.rb tap/Formula/slopdesk.rb
          cp packaging/homebrew/Casks/slopdesk.rb tap/Casks/slopdesk.rb
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${cli_sha}\"/" Formula/slopdesk.rb
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${dmg_sha}\"/" Casks/slopdesk.rb
          # The `sed` above is one substitution per file and silently a no-op if the shape moves.
          # Proving it landed here costs one grep and turns a shipped-wrong-SHA into a red job.
          grep -q "^  version \"${VERSION}\"$" Formula/slopdesk.rb || {
            echo "the formula's version line did not take the rewrite" >&2; exit 1; }
          grep -q "^  sha256 \"${cli_sha}\"$" Formula/slopdesk.rb || {
            echo "the formula's sha256 line did not take the rewrite" >&2; exit 1; }
          grep -q "^  version \"${VERSION}\"$" Casks/slopdesk.rb || {
            echo "the cask's version line did not take the rewrite" >&2; exit 1; }
          grep -q "^  sha256 \"${dmg_sha}\"$" Casks/slopdesk.rb || {
            echo "the cask's sha256 line did not take the rewrite" >&2; exit 1; }
          git config user.name "slopdesk-release"
          git config user.email "release@slopdesk.invalid"
          git commit -am "slopdesk ${VERSION}"
          git push
