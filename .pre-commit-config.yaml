# Git hooks, run by prek (https://github.com/j178/prek) — a fast, drop-in pre-commit
# runner. Also works with classic `pre-commit`.
#
# SPEED DESIGN (fastest commit + highest cache hit):
#   • Two stages: format + lint run on `pre-commit` (cheap, file-scoped); the slow
#     unit tests run on `pre-push` (once per push, not per commit).
#   • Every language hook is `language: system` → NO hook environment to provision,
#     so there's nothing to build/cache-miss; it just shells out to the already-
#     installed tool (same ones `make lint`/`make test` use).
#   • Each hook is gated by a tight `files:` regex, so a commit touching only .sh
#     (say) runs ONLY the shell hooks — prek skips every other hook entirely.
#   • prek runs independent hooks in PARALLEL and starts ~instantly (Rust, no venv).
#
# Install (idempotent):   prek install      # installs BOTH pre-commit + pre-push hooks
# Run manually:           prek run --all-files
#                         prek run --all-files --hook-stage pre-push
# Skip once:              git commit --no-verify   /   git push --no-verify

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # Generic hygiene (prek runs these natively — no Python env needed). Pinned to
  # pre-commit so the file-modifying ones never fire at push time.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # `slopdesk_ffi.h` used to be exempt from the three file-modifying hooks below, on the ground
      # that it was cbindgen OUTPUT and a `cmp` drift-gate (`check-ffi-header`) would fail if a hook
      # rewrote a byte. Both halves of that are gone: cbindgen was rejected (`docs/55` — it would
      # have to run inside `swift build`, which is forbidden, or in a step nobody types), the header
      # is HAND-WRITTEN and reviewed like any other source, and no `check-ffi-header` target exists
      # to be surprised. An exemption whose reason has been deleted only protects the one file most
      # worth keeping tidy.
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: '\.md$|^ThirdParty/'
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^ThirdParty/'
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        # 3072 admits the bundled Symbols Nerd Font (2.4 MiB) — still small enough to catch a stray
        # binary/screenshot landing in the tree.
        args: [--maxkb=3072]
      - id: mixed-line-ending
        stages: [pre-commit]
        args: [--fix=lf]

  - repo: local
    hooks:
      # ============================ FORMAT (apply) ============================
      # These WRITE formatting fixes. If a file changes, the commit aborts so you
      # re-stage the formatted result (standard format-hook flow).
      - id: swiftformat
        name: swiftformat (apply)
        entry: swiftformat
        language: system
        # product trees + the package manifest — matches `make fmt-swift`. The standalone
        # probe/spike .swift scripts under scripts/ & docs/ stay out of scope.
        files: '^(Package\.swift|(Sources|Tests|Apps)/.*\.swift)$'

      - id: rustfmt
        name: rustfmt (apply)
        # NIGHTLY: rust/rustfmt.toml enables unstable options (wrap_comments, group_imports,
        # format_strings). Only the formatter needs it — the crate builds/tests on stable.
        #
        # Through the Makefile target, not `cd rust` directly: `rust/` holds SEVENTEEN workspaces and
        # `--all` means "every member of THIS one", so the bare form formatted the four root members
        # and left the other sixteen crates alone — while `make lint`'s per-workspace `--check` still
        # judged them. A hook that fixes less than the gate checks sends you to `--no-verify`.
        entry: make fmt-rust
        language: system
        files: '^rust/.*\.(rs|toml)$'
        pass_filenames: false

      - id: shfmt
        name: shfmt (apply)
        entry: shfmt -i 2 -ci -sr -w
        language: system
        files: '\.sh$'
        exclude: '^ThirdParty/'

      # ============================== LINT (check) ===========================
      - id: swiftlint
        name: swiftlint --strict
        # `--force-exclude` is REQUIRED here, unlike in `make lint`. SwiftLint honours the config's
        # `excluded:` only when it discovers files itself; a path passed explicitly on the command line
        # overrides it. This hook passes the staged paths, so without the flag it strict-lints the
        # dev-exec harnesses that `.swiftlint.yml` deliberately excludes — a false failure that forces
        # a `--no-verify` bypass.
        entry: swiftlint lint --strict --quiet --force-exclude
        language: system
        # product trees only — matches the .swiftlint.yml `included:` (Sources/Tests/Apps).
        files: '^(Sources|Tests|Apps)/.*\.swift$'
        # Mirrors the dev-exec entries of .swiftlint.yml `excluded:`. Needed IN ADDITION to
        # `--force-exclude`: if every staged path were an excluded one, swiftlint would be handed a
        # file list it fully discards and exit 1 ("No lintable files found"). Dropping them here means
        # prek skips the hook outright instead.
        exclude: '^Sources/slopdesk-(loopback-validate|capture-probe|fake-client)/'

      - id: clippy
        name: cargo clippy -D warnings (every workspace)
        # Same reason as rustfmt above: `--workspace` at `rust/` reaches the root's four members and
        # none of the sixteen crates that declare their own `[workspace]` — the silently-unlinted-crate
        # failure `docs/46` names. `lint-rust-clippy` is the clippy half of `lint-rust` WITHOUT its
        # `fmt --check`, because prek runs hooks in parallel and the rustfmt hook above is rewriting
        # the very files a `--check` would be reading. ~8 s warm across all seventeen.
        entry: make lint-rust-clippy
        language: system
        files: '^rust/.*\.(rs|toml)$'
        pass_filenames: false

      - id: cargo-test
        name: cargo test (every workspace)
        # The relay's framing is a WIRE contract with AgentHookRecord.split on the host; the
        # byte-for-byte tests are the pin, so they gate the commit like golden-check does — and so do
        # the other sixteen crates' suites, which `cd rust && cargo test --workspace` never ran while
        # this hook fired on any `rust/**.{rs,toml}` change. ~16 s warm for all seventeen.
        entry: make test-rust
        language: system
        files: '^rust/.*\.(rs|toml)$'
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: '\.sh$'
        exclude: '^ThirdParty/'

      # ===================== COMMIT MESSAGE (commit-msg) =====================
      # The commit subject is an INPUT to the release, not prose: `cliff.toml` reads the
      # type to place the commit in CHANGELOG.md, and `git cliff --bumped-version` reads it
      # to compute the next version. Enforcing it here is what lets both be generated
      # instead of hand-maintained. `always_run` and NO `files:` regex: the commit-msg
      # stage hands the hook the message FILE rather than the staged paths, so a `files:`
      # pattern would match nothing and quietly skip every commit.
      - id: commit-msg-conventional
        name: conventional commit subject
        entry: cargo run --release --quiet --manifest-path rust/slopdesk-devtools/Cargo.toml --bin slopdesk-release -- commit-msg
        language: system
        stages: [commit-msg]
        always_run: true

      # ===================== UNIT TESTS (pre-push only) ======================
      # Slow → kept off the per-commit path. The script adds two speedups on top of the
      # incremental build cache: a GREEN-TREE CACHE (a push of a HEAD^{tree} already tested
      # green — by `make test`/`make check` or a previous push — skips the run entirely) and
      # `--parallel` (per-class xctest workers, ~92s → ~60s; safe since `SettingsKey.store`
      # isolates each worker's UserDefaults).
      #
      # The `files:` list is what DECIDES to consult the script; the script's own cache then decides
      # whether to run. So it must name every input the suite consumes, not just the Swift it
      # compiles. `rust/` and `ThirdParty/slopdesk-ffi/` are on it because the suite LINKS
      # `SlopDeskFFI.xcframework` — a push that only moves Rust would otherwise skip the Swift gate
      # entirely, which is the same blind spot the green-tree cache had inside the script until the
      # artifact stamp joined its key. `golden/` pins the wire, `Package.*` decides the graph, and
      # `scripts/` is read off DISK at runtime by the gate-contract tests (`LaunchRestoreGateContract`
      # in `SlopDeskWorkspaceCoreTests`, `GuiGateLaunchContract` in `SlopDeskClientCoreTests`) —
      # `test-touched.sh` already attributes a scripts change to those targets, so leaving it out here
      # meant the fast inner loop knew about an input the push gate did not.
      #
      # `make test`, NOT `bash scripts/pre-push-test.sh` directly. Eighteen suites boot a real
      # sidecar — superd, screend, dropd — and every one of them `XCTSkip`s by name when its binary
      # is absent, deliberately, so a missing daemon reads as "not run" rather than as a pass. But
      # `swift build` never sees cargo, so nothing in the Swift graph builds those binaries: calling
      # the script straight meant a push whose tree had never had `make test` run against it
      # skipped the whole supervised, screen and file-drop surface and reported green. `make test`
      # lists the sidecar builds as prerequisites and then runs this same script, so the green-tree
      # cache still makes a repeat push instant.
      - id: swift-test
        name: swift test (sidecars first, then the green-tree cache + --parallel)
        entry: make test
        language: system
        files: '^((Sources|Tests|Apps)/.*\.swift|rust/.*\.(rs|toml)|ThirdParty/slopdesk-ffi/.*|golden/.*|scripts/.*|Package\.(swift|resolved))$'
        pass_filenames: false
        stages: [pre-push]

      # The cross-language ratchet: which Swift files must stay deleted, socket paths,
      # relinquish-vs-terminate and the FFI staleness gate.
      #
      # It reached the tree only through `make lint` / `make check`, both of which are typed by
      # hand — the same "a gate nobody runs" shape as the Miri audit that paid for the third
      # `unsafe` crate and had never once executed. Here it runs on every push.
      #
      # `always_run` with NO `files:` on purpose. Every other hook here can name its inputs; this
      # one cannot. It asserts things like "no Swift file anywhere respells a Rust constant" and
      # "this file is still absent", and an absence has no path to put in a regex — a deletion
      # that violates it stages as a change to some unrelated file, or to none. It costs ~39 s and
      # prek runs it beside `swift-test`, so on a push that also touches Swift it is free.
      - id: supervisor
        name: cross-language contract ratchet (check-supervisor.sh)
        entry: make lint-supervisor
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
