# The narrow iOS spec for the real-device GUI-video test (PATH 2 / ô ④): SlopDeskPhoneUI +
# SlopDeskVideoClient and nothing else, so a device run that only has to prove video decode/render
# does not carry the rest of the app's link graph.
#
# ⚠️ Its ORIGINAL reason is gone and this spec may be too. It existed to drop a 566MB
# `libghostty.xcframework` that `project.yml` listed and this one did not — AppMain gated the
# renderer on `#if canImport(CGhostty)`, so building through here left the terminal on its
# build-status placeholder while the video sheet worked fully. There is no xcframework in either
# spec now (docs/68), AppMain's renderer gate is gone, and what separates the two files is only the
# video half and the asset/entitlement detail. Whoever next runs the ô ④ test should decide whether
# this is still a spec or a duplicate of `project.yml`.
name: ClientApp-iOS
options:
  bundleIdPrefix: com.slopdesk
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  SlopDesk:
    path: ../..

targets:
  ClientApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: AppMain.swift
      - path: ../Shared/Assets.xcassets
    dependencies:
      # The iOS app shell: AppMain launches `PhoneAppDelegate` from this product.
      - package: SlopDesk
        product: SlopDeskPhoneUI
      - package: SlopDesk
        product: SlopDeskVideoClient
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopdesk.client.ios
        PRODUCT_NAME: SlopDesk
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
