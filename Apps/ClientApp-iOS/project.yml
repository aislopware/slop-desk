# XcodeGen spec for the SlopDesk iOS client app.
#
# This project.yml is the SOURCE OF TRUTH; the generated `.xcodeproj` is gitignored
# (regenerate with: `xcodegen generate --spec Apps/ClientApp-iOS/project.yml`).
#
# The app target depends on the LOCAL SwiftPM package product `SlopDeskPhoneUI` — the iOS APP SHELL
# (docs/56 §2). It links no other UI product, and never the Mac's. It carries
# the iOS UIKit native-feel table-stakes (KeyRepeater / IMEProxyTextView /
# FloatingCursorController / KeyboardAccessoryBar — doc 17 §2.5). The `@main` entry is
# `AppMain.swift` beside this spec → `SlopDeskPhoneApp`.
#
# The libghostty `GhosttyTerminalView` is added once the xcframework exists; until then the
# BUILD-STATUS placeholder renders (libghostty-only policy, no fallback VT engine).
name: ClientApp-iOS
options:
  bundleIdPrefix: com.slopdesk
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  SlopDesk:
    path: ../..
  # Type-safe SF Symbols. Declared HERE only because the test bundle's render harness
  # (`Tests/SlateSnapshotRender.swift`) redraws a mark's `StatusMark/systemSymbol` at magnified sizes and
  # so names `Image(systemSymbol:)` itself. Same requirement as `Package.swift`'s, so SwiftPM resolves ONE
  # copy for the whole graph.
  SFSafeSymbols:
    url: https://github.com/SFSafeSymbols/SFSafeSymbols.git
    from: 7.0.0

targets:
  ClientApp-iOS:
    type: application
    platform: iOS
    sources:
      # The iOS `@main` shell (`AppMain.swift`) beside this spec, and the shared asset catalogue.
      - path: AppMain.swift
      - path: ../Shared/Assets.xcassets
      # Brand: the Slopcat app icon as an Icon Composer bundle (canonical copy in
      # docs/brand — one source, three targets). actool compiles it for iOS 26's
      # layered/tinted icon variants; pairs with ASSETCATALOG_COMPILER_APPICON_NAME.
      - path: ../../docs/brand/SlopDesk.icon
        buildPhase: resources
      # PATH 1 (libghostty renderer): the gated renderer host + binding (GhosttySurface.swift
      # + GhosttyTerminalView.swift). NOT members of any Package.swift target — they join THIS
      # app target so `import CGhostty` resolves and `#if canImport(CGhostty)` flips true.
      - path: ../../ThirdParty/ghostty/integration/GhosttySurface
    dependencies:
      # The iOS app shell: AppMain launches `SlopDeskPhoneApp` from this product, which transitively
      # pulls in the view layer, `SlopDeskClientCore` and `SlopDeskWorkspaceCore` (logic + seam types).
      - package: SlopDesk
        product: SlopDeskPhoneUI
      # PATH 2 (GUI video path): links the client decode/render/cursor pipeline so
      # AppMain can register VideoWindowFactory.shared with the real VideoWindowView.
      # Carries VideoToolbox/Metal — never instantiated in tests, only at GUI launch.
      #
      # TWO PRODUCTS since the video carve (docs/56 §3): `SlopDeskVideoClient` is the platform-free
      # ENGINE (session, pipeline, connection, discovery — the types AppMain names directly), and
      # `SlopDeskVideoClientPhone` is the UIKit HALF that draws it. The macOS app lists
      # `SlopDeskVideoClientMac` in its place; a target that listed BOTH halves would defeat the
      # carve, since the point is that neither half is reachable from the other's platform.
      - package: SlopDesk
        product: SlopDeskVideoClient
      - package: SlopDesk
        product: SlopDeskVideoClientPhone
      # PATH 1 (libghostty renderer): the libghostty static binary (link-time `ghostty`
      # C-ABI symbols) as an xcframework. The UNIVERSAL build ships ios-arm64 (device) +
      # ios-arm64-simulator slices, both built on this host against the iOS 26.5 SDK; the
      # xcframework auto-selects the right slice per destination.
      - framework: ../../ThirdParty/ghostty/libghostty.xcframework
        embed: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    # iOS apps are not App-Sandboxed via entitlement keys and have network access by
    # default; the byte pipeline pauses on background + resumes byte-exact on foreground
    # (SlopDeskClient.pause()/resume()), so no persistent background mode is declared. No
    # custom entitlements needed for the standard client.
    #
    # LOCAL NOTIFICATIONS (the three sinks `SlopDeskPhoneApp` installs) need NOTHING here, and that
    # is a fact about the platform rather than an omission: `UNUserNotificationCenter` gates on the
    # user's runtime GRANT, which `requestAuthorization` asks for lazily on the first event that
    # survives the toggles. There is no Info.plist usage-description key for it (unlike camera/mic)
    # and no capability to enable — `aps-environment` belongs to REMOTE push, which this app does not
    # do and which would need an Apple Developer account action. The one real limit is the lifecycle
    # above: a backgrounded app has paused its connection, so an event arriving while the phone is
    # locked is delivered on the next foreground rather than at the moment it happened. Closing that
    # would take a push channel (a host-side APNs sender + that capability), not a plist key.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopdesk.client.ios
        PRODUCT_NAME: SlopDesk
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: SlopDesk
        # The app-wide NEUTRAL accent (Apps/Shared/Assets.xcassets/AccentColor) — same graphite
        # grey as the macOS client, so controls/selection read neutral on both platforms.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # PATH 1 (libghostty renderer): point the Swift importer at the CGhostty clang
        # module map (module.modulemap + vendored ghostty.h) so `import CGhostty` resolves
        # and `#if canImport(CGhostty)` flips true → GhosttyTerminalView/GhosttySurface
        # compile into this target and link against libghostty.xcframework.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../ThirdParty/ghostty/integration/CGhostty
        # The xcframework ships ios-arm64 (device) + ios-arm64-simulator — both arm64
        # only (Apple-silicon target). Pin ARCHS=arm64 so a generic 'iOS Simulator'
        # destination does NOT also demand an x86_64 slice (which would fail to link).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        # libghostty vendors C/C++ deps (Dear ImGui, spirv-cross, glslang, FreeType,
        # sentry, oniguruma, …) referencing the C++ runtime + a few iOS system frameworks
        # (CoreText/CoreGraphics for fonts, QuartzCore/Metal for the layer). NO Carbon —
        # it is macOS-only; the iOS slice does not reference it.
        OTHER_LDFLAGS:
          - -lc++
          - -framework
          - CoreText
          - -framework
          - CoreGraphics
          - -framework
          - QuartzCore
          - -framework
          - Metal
        # Best-effort builds run unsigned for an iOS Simulator destination:
        #   xcodebuild build -destination 'generic/platform=iOS Simulator' \
        #     CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  # The iOS-triple XCTest bundle — the only place a test can OBSERVE an `#if os(iOS)` branch.
  # `swift test` compiles the macOS slice, so every iOS default (`WorkspaceClientKind.thisPlatform`,
  # `DevicePreferences.platformDefaultFollowSessionFocus`, the letterbox's phone-shaped geometry) is
  # asserted against the WRONG branch there. A HOST-LESS logic bundle on purpose: it needs no app, no
  # window server and no libghostty, so `slopdesk-gate ios-tests` can load it straight into the
  # simulator's `xctest` agent.
  #
  # docs/56 F4c: it is ALSO the home of every `SlopDeskPhoneUI` view test, because `SlopDeskPhoneUI` is
  # `#if os(iOS)` end to end — the SwiftPM test target that used to hold them (`SlopDeskPhoneUITests`)
  # could only ever compile against an EMPTY module on the macOS host, so it was deleted rather than
  # left reading as a live rule. That includes the phone's opt-in PIXEL rigs (`SlateSnapshotRender`,
  # `ToastStackViewTests`, `ToastStateGalleryTests`), which `XCTSkip` unless their `SLOPDESK_*` env var
  # is set and so cost this gate compile coverage only. The Mac's rigs stay in `Tests/SlopDeskMacUITests`.
  ClientApp-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        # `Tests/.swiftlint.yml` is the nested lint config for this tree (the test relaxations the
        # SwiftPM `Tests/` tree already gets), not a bundle resource — keep it out of the target.
        excludes:
          - ".swiftlint.yml"
      # The `makeSession` seam's test double, SHARED with `SlopDeskWorkspaceCoreTests` rather than
      # copied: a second `FakePaneSession` would drift from `PaneSessionHandle` and the iOS suite
      # which arrived with `SharedFocusSettingTests` in F4c, is a narrower double of the SAME seam and
      # is now redundant against this one — see the ⚠️ in its own file.)
      - path: ../../Tests/SlopDeskWorkspaceCoreTests/Workspace/Support/FakePaneSession.swift
    dependencies:
      - package: SlopDesk
        product: SlopDeskPhoneUI
      - package: SlopDesk
        product: SlopDeskWorkspaceCore
      - package: SlopDesk
        product: SlopDeskTerminal
      - package: SlopDesk
        product: SlopDeskProtocol
      # The view suites' two floors below the phone shell: the seam types + the toast/chip models
      # (`SlopDeskClientCore`) and the design tokens every render stands on (`SlopDeskSlate`). Both are
      # `@testable`-imported — this bundle is an Xcode target OUTSIDE the SwiftPM package, so a plain
      # `import` cannot see a `package` declaration, which is what the whole `Slate` ladder is.
      - package: SlopDesk
        product: SlopDeskClientCore
      - package: SlopDesk
        product: SlopDeskSlate
      # `SlateSnapshotRender` redraws a status mark's symbol at magnified sizes, so it names
      # `Image(systemSymbol:)` directly rather than borrowing the shipping view's.
      - package: SFSafeSymbols
        product: SFSafeSymbols
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopdesk.client.ios.tests
        PRODUCT_NAME: ClientApp-iOSTests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        SWIFT_ENABLE_TESTABILITY: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - ClientApp-iOSTests
