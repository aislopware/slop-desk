# XcodeGen spec for the SlopDesk macOS client app.
#
# This project.yml is the SOURCE OF TRUTH; the generated `.xcodeproj` is gitignored
# (regenerate with: `xcodegen generate --spec Apps/ClientApp-macOS/project.yml`).
#
# The app target depends on the LOCAL SwiftPM package product `SlopDeskMacUI` — the macOS APP
# SHELL (docs/56 §2). It links no other UI product, and never the phone's. (`SlopDeskMacUI`
# transitively pulls SlopDeskClient/SlopDeskInspector/SlopDeskClaudeCode.) The `@main` entry is
# `AppMain.swift` beside this spec → `SlopDeskMacApp` (in the library).
#
# The terminal's conformer view IS listed, and directly. It used to be listed by nothing: it linked
# a gitignored `libghostty.xcframework` and imported a `CGhostty` clang module, so it was a member
# of no `Package.swift` target and joined THIS app by an injected sources entry + a framework
# dependency + a `SWIFT_INCLUDE_PATHS` line, all three written in by `slopdesk-ops enable-renderer`.
# The fork is gone (docs/68) — the conformer lives in `Sources/SlopDeskTerminal/`, `swift build`
# compiles it, and `AppMain` registers it with one call. It hangs off the APP rather than off
# `SlopDeskMacUI` on purpose: the shell mounts terminals through `TerminalRendererFactory` and must
# not be able to name the view that draws one.
name: ClientApp-macOS
options:
  bundleIdPrefix: com.slopdesk
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  SlopDesk:
    # The local SwiftPM package at the repo root (two levels up from this spec).
    path: ../..

targets:
  ClientApp-macOS:
    type: application
    platform: macOS
    sources:
      # The macOS `@main` shell (`AppMain.swift`) beside this spec, and the shared asset catalogue.
      - path: AppMain.swift
      - path: ../Shared/Assets.xcassets
      # Brand: the Slopcat app icon as an Icon Composer bundle (docs/brand is its
      # canonical home — one copy, three targets). Compiled by actool into Assets.car
      # + SlopDesk.icns; pairs with ASSETCATALOG_COMPILER_APPICON_NAME below.
      - path: ../../docs/brand/SlopDesk.icon
        buildPhase: resources
    dependencies:
      # The macOS app shell: AppMain launches `SlopDeskMacApp` from this product, which transitively
      # pulls in the view layer, `SlopDeskClientCore` and `SlopDeskWorkspaceCore` (logic + seam types).
      - package: SlopDesk
        product: SlopDeskMacUI
      # The RENDERER, named DIRECTLY rather than pulled through the UI shell. `AppMain` calls
      # `installTerminalRenderer()`, and the UI shell must never depend on this product: the whole
      # point of `TerminalRendererFactory` is that a canvas mounts a terminal without naming the view
      # that draws one, so a canvas target that linked it would have the seam and the coupling both.
      - package: SlopDesk
        product: SlopDeskTerminal
      # PATH 2 (GUI video path): links the client decode/render/cursor pipeline so
      # AppMain can register VideoWindowFactory.shared with the real MacVideoWindowView.
      # Carries VideoToolbox/Metal — never instantiated in tests, only at GUI launch.
      #
      # TWO PRODUCTS since the video carve (docs/56 §3): `SlopDeskVideoClient` is the platform-free
      # ENGINE (session, pipeline, connection, discovery — the types AppMain names directly), and
      # `SlopDeskVideoClientMac` is the AppKit HALF that draws it. The iOS app lists
      # `SlopDeskVideoClientPhone` in its place; a target that listed BOTH halves would defeat the
      # carve, since the point is that neither half is reachable from the other's platform.
      - package: SlopDesk
        product: SlopDeskVideoClient
      - package: SlopDesk
        product: SlopDeskVideoClientMac
    info:
      path: Info.plist
      properties:
        LSMinimumSystemVersion: "26.0"
        NSHighResolutionCapable: true
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        # The CODE panel's WKWebView loads the host's code-server over plain HTTP on the WireGuard
        # mesh (security = the mesh, no app-layer crypto by invariant). ATS only exempts literal
        # localhost, so without this the workbench is silently blank on any real (non-loopback)
        # host address.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: ClientApp-macOS.entitlements
      properties:
        # The macOS CLIENT is a viewer: connects out over (NetBird) network + renders bytes.
        # No Accessibility / CGEvent / screen-capture (those are PATH 2 HOST concerns, doc 06)
        # → sandboxed with only an outbound network-client entitlement.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopdesk.client.macos
        PRODUCT_NAME: SlopDesk
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: SlopDesk
        # The app-wide NEUTRAL accent (Apps/Shared/Assets.xcassets/AccentColor): controls, focus
        # rings, text selection and prominent buttons all resolve to a graphite grey instead of the
        # machine's accent. This is the ONE supported way to reach NSColor.keyboardFocusIndicatorColor
        # (a field's focus ring) — per-subtree `.tint()` never gets there.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # arm64 only, and it stays that way now that the fork it arrived with is gone. The pin's
        # ORIGINAL reason was the fork's xcframework, which shipped a `macos-arm64` slice and no
        # other; docs/49 §"arm64 only" keeps the pin on reasons 2 and 3, which bind on their own:
        # this app deploys against macOS 26, which no Intel Mac runs, and the cask declares
        # `depends_on arch: :arm64` so `brew` refuses an Intel install outright.
        #
        # `ONLY_ACTIVE_ARCH: NO` so a local debug build produces the same single slice a release
        # does, rather than silently narrowing to whatever the developer's machine is.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        # There is deliberately no `SWIFT_INCLUDE_PATHS` and no `OTHER_LDFLAGS` here. Both existed
        # only to make the fork link: an include path at its `CGhostty` module map, and `-lc++`
        # plus five frameworks to resolve the C/C++ dependencies its static library vendored. This
        # target compiles ONE Swift file (`AppMain.swift`) and links SwiftPM products; every
        # framework the Rust half needs is named by `Package.swift`'s linker settings, where an
        # `.xcframework` can no longer carry `#[link]` metadata across `-create-xcframework`, and
        # everything the Swift half needs is auto-linked by the `import` that uses it. A framework
        # listed HERE instead would be invisible to `swift build` and would fail only in Xcode.
        #
        # Best-effort builds in CI / this environment run unsigned:
        #   xcodebuild build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
