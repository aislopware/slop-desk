# Nested config for EVERY test tree — inherits the root .swiftlint.yml and relaxes the
# rules that are IDIOMATIC in tests: a test SHOULD force-unwrap/try!/as! a known-good
# fixture (you want it to crash loudly on an unexpected shape), and `var sut: Foo!` in
# setUp is the standard pattern. The pure assertion-style rules are also test-noise.
# Everything else (correctness, the bug rules) stays on for tests too.
#
# THERE ARE TWO TEST TREES AND THIS IS THE ONLY COPY OF THIS LIST.
# `Apps/ClientApp-iOS/Tests/.swiftlint.yml` is a SYMLINK to this file. That tree holds the iOS-triple
# XCTest bundle (`scripts/check-ios-tests.sh`), which since docs/56 F4c is where every `SlopDeskPhoneUI`
# view suite lives — the target is `#if os(iOS)` end to end, so the macOS `swift test` host cannot
# compile one. Without a nested config there those suites would be linted under the SOURCE rules purely
# because of which directory the split moved them to; with a COPIED one, the two lists drift and one
# test tree silently gets different rules than the other. `check-supervisor.sh` fails the build if the
# symlink is replaced by a regular file.
disabled_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - implicitly_unwrapped_optional
  - xct_specific_matcher
  - xctfail_message
  - balanced_xctest_lifecycle
  - single_test_class
  - non_overridable_class_declaration
