# tools.lock — the pinned host-side runtime dependencies of the right panel.
#
# Every surface in the right panel stands on a third-party program that is NOT part of this repo's
# build: the code panel runs `code-server`, the simulator panel runs `baguette serve`, the Android
# panel runs `adb` and pushes `scrcpy-server`. Before this file they were whatever Homebrew had
# installed, which is how the code panel spent months on Code 1.112: the `code-server` formula froze
# at 4.112 and was deprecated, and nothing in the repo recorded — or could enforce — which version
# the panel was actually written against.
#
# So the version lives here, pinned by URL and SHA-256, and `provision.sh` materialises it under
# `.prefix/` (gitignored). One bargain, everywhere in this tree: the RECIPE is committed, the
# ARTIFACT is not — the ghostty entry below is the same trade as the code-server one above it.
#
# What is deliberately NOT here, because it cannot be:
#   * iOS simulator runtimes and `simctl` — they ship inside Xcode under Apple's licence. `baguette`
#     is the vendorable half; the simulators it drives are the host's.
#   * The Android emulator and its system images — `sdkmanager` gates them behind an interactive
#     licence accept and they run to gigabytes per API level. `adb` is the vendorable half.
# For both, the panel keeps its existing host-discovery path (Xcode / the SDK roots in
# `AndroidToolchain.sdkRoots`) and reports unavailable when the host has none.
#
# FORMAT — one record per line, `|`-separated, no spaces around the separator:
#
#   name | version | kind | binary | url | sha256
#
#   name     the provisioned command; becomes `.prefix/bin/<name>`. Also what the Swift locators
#            search for, so it must match the program's real invocation name.
#   version  the upstream release. Also the directory under `.prefix/<name>/`, so two versions can
#            sit side by side and a rollback is a relink rather than a re-download.
#   kind     `tar.gz`, `zip`, `file` (committed under `vendor/`, never downloaded), or `git` (a
#            SOURCE tree cloned at a pinned commit — no binary, no `.prefix/bin` symlink).
#   binary   path to the executable INSIDE the extracted tree, after its single top-level directory
#            is stripped. For `file`, the path under `vendor/`. For `git`, the SENTINEL file the
#            clone is checked for, which is what makes "the tree is there" mean "it is the right
#            tree".
#   url      the exact release asset, or for `git` the repository to clone. Never a `latest` alias —
#            an unpinnable URL is the bug this file exists to fix.
#   digest   verified on every provision. A mismatch deletes the download and fails; it is never
#            "probably fine". For the archive kinds this is the SHA-256 of the bytes; for `git` it
#            is the 40-hex COMMIT, which is content-addressed over the whole tree and therefore a
#            stronger pin than a tarball digest — GitHub's generated archives are not guaranteed
#            byte-stable, so a source tree must never be pinned as one.
#
# CHANGING A PIN is a deliberate act with a tail. For `code-server` specifically, a version bump
# also means re-measuring `CodeSidebarWebView.clippedTitleBarHeight` against the new workbench and
# re-checking the seed against the new settings schema — `docs/46-gates-env-paths.md` has the
# procedure, `docs/DECISIONS.md` has why.

# code-server — the code panel's workbench (verb 18). The floor is 4.121: Code 1.121 is where the
# built-in `mermaid-markdown-features` extension landed, and the panel renders mermaid fences
# through it rather than through the deprecated `bierner.markdown-mermaid`.
code-server|4.131.0|tar.gz|bin/code-server|https://github.com/coder/code-server/releases/download/v4.131.0/code-server-4.131.0-macos-arm64.tar.gz|f7ebe8ac986ab0b89eb5882a5c804ad15c2999ad58a13c042f7645fa85124e5d

# baguette — the simulator panel's server (verb 21). Ships the executable as `Baguette` (capital B)
# next to the `Baguette_Baguette.bundle` it loads its web assets from, so `binary` is the bare name
# and the two stay siblings inside the versioned directory. The `.prefix/bin/baguette` symlink was
# checked to still resolve that bundle — `serve` binds and serves through it — so no wrapper is
# needed; re-check on a version bump if the panel ever comes up blank.
baguette|0.1.88|tar.gz|Baguette|https://github.com/tddworks/baguette/releases/download/v0.1.88/baguette_v0.1.88_macOS_arm64.tar.gz|81752085712ccb6b6075ccbb6f6c298e190c0080060b9c5f11244ec101b1e967

# adb — the Android panel's device channel (verb 22). Google publishes the versioned zip alongside a
# SHA-1 in `repository2-3.xml`; that SHA-1 was checked against this download, and the SHA-256 below
# is ours, so the pin verifies with the same one-way function as every other record here.
adb|37.0.1|zip|adb|https://dl.google.com/android/repository/platform-tools_r37.0.1-darwin.zip|ee39ad5967e95c2a07f04dbcbde96b1a0c916ba376096db5d2f498b7727a5d1d

# scrcpy-server — pushed to the device by the Android bridge. `kind=file`: at 716 KB it is the one
# dependency small enough to live in git outright, and it is the only one that is not an executable
# (a jar the device's own `app_process` runs), so it carries no signing, quarantine or
# architecture concern. Committed at `vendor/scrcpy-server`; the SHA-256 is upstream's own, from the
# v4.1 `SHA256SUMS.txt`, and is verified against the committed bytes so a corrupted checkout is
# caught rather than pushed to a phone.
scrcpy-server|4.1|file|scrcpy-server|https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1|deacb991ed2509715160ffdc7907e47b4160eb30d1566217e9047fd5b8850cae

# ghostty — the terminal ENGINE's source, and the one record here that is not a runtime dependency
# of the right panel. `libghostty-vt-sys`'s `build.rs` compiles ghostty with Zig at build time and,
# left alone, clones it from the network to do so. That is incompatible with a content-stamped gate
# and with a reproducible release, so the fetch is taken away from it: this record materialises the
# tree and `just ghostty-src` exports `GHOSTTY_SOURCE_DIR` at it, which `build.rs` honours by
# short-circuiting its own clone entirely.
#
# The commit is the one the pinned bindings (`aislopware/libghostty-rs` @ `519649e`, a soundness
# mirror of `Uzaaft/libghostty-rs` — see `docs/68` §4) were generated against — changing one without
# the other is how the Rust surface and the Zig library drift apart. The mirror carries no
# regeneration, so it did not move this commit.
# `version` is descriptive only; the commit is the pin. See `docs/68-terminal-surface-in-rust.md` §3.
ghostty|22d13172|git|build.zig|https://github.com/ghostty-org/ghostty.git|22d13172cde98a0a4dda05d3d6a3fcb0dd8ed018
