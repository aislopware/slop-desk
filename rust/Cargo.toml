[workspace]
# The SHORT-LIVED programs in the tree, plus the library halves of two of them. Each is forked per
# event — the hook twice per tool call, ctl once per agent command, `slopdesk` once per keystroke a
# user types, the probe once per metadata request a client makes — so all of them want the
# startup-tuned profile below, and that shared requirement is the whole reason they share a
# workspace. (`slopdesk-agenthooks` is the one member here that is NOT forked per event; it rides
# the hook's crate because it installs the hook, and it inherits this profile harmlessly.)
#
# `slopdesk-sidecars` is the one member that is not a program or a program's library half: it is the
# per-tool version policy, and it is here because BOTH its callers are — `slopdesk sidecars`, which
# is another fork-and-exit invocation, and the `.xcframework` the host links. Nothing in it wants a
# daemon's profile; it holds no state and never blocks.
#
# `slopdesk-hostlaunch` joins on exactly that argument: hostd's argv grammar and the launch record,
# read by the `.xcframework` the daemon links and by `slopdesk-ops restart-hostd`. It holds no
# state, never blocks, and needs no `unsafe`, so the profile and the `forbid` above both cost it
# nothing.
members = ["slopdesk-hook", "slopdesk-ctl", "slopdesk-cli", "slopdesk-probe", "slopdesk-sidecars", "slopdesk-hostlaunch"]
# `slopdesk-superd` is a SEPARATE workspace living in this directory, not a member — see
# `slopdesk-superd/Cargo.toml` for why. The exclude is what keeps cargo from adopting it.
exclude = ["slopdesk-superd"]
resolver = "3"

# The hook runs on EVERY PreToolUse/PostToolUse — twice per tool call, and ctl runs once per agent
# command. Startup time is the whole cost for both (the hook's socket write itself is ~11µs), so the
# release profile is tuned for a small, fast-starting binary rather than throughput.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# ---------------------------------------------------------------------------- #
# Maximal-strict lints. Same philosophy as .swiftlint.yml: every group ON, minus a
# curated, REASONED disabled set. `cargo clippy --workspace --all-targets -- -D warnings`
# (the prek hook) turns every one of these into a hard failure.
[workspace.lints.rust]
# The compiler-proven guarantee DECISIONS.md called the one real thing lost when the Rust
# core came out. This crate touches raw sockets and still needs none of it.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# A curated slice of `restriction` — the group is deliberately self-contradictory upstream, so
# it is opted into lint-by-lint rather than wholesale.
#
# The panic-family matters more here than anywhere else in the tree: this binary runs on the
# agent's critical path with `panic = "abort"`, and a panic is a non-zero exit, which Claude Code
# surfaces as a broken turn. The contract is "never fail loudly" — these make the compiler hold
# us to it.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `multiple_crate_versions` (cargo): zero dependencies, so it can only ever fire on a
#   toolchain artefact outside our control.
multiple_crate_versions = "allow"
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
