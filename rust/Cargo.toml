[workspace]
members = ["slopdesk-hook"]
resolver = "3"

# The hook runs on EVERY PreToolUse/PostToolUse — twice per tool call. Startup
# time is the whole cost (the socket write itself is ~11µs), so the release
# profile is tuned for a small, fast-starting binary rather than throughput.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# ---------------------------------------------------------------------------- #
# Maximal-strict lints. Same philosophy as .swiftlint.yml: every group ON, minus a
# curated, REASONED disabled set. `cargo clippy --workspace --all-targets -- -D warnings`
# (the prek hook) turns every one of these into a hard failure.
[workspace.lints.rust]
# The compiler-proven guarantee DECISIONS.md called the one real thing lost when the Rust
# core came out. This crate touches raw sockets and still needs none of it.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# A curated slice of `restriction` — the group is deliberately self-contradictory upstream, so
# it is opted into lint-by-lint rather than wholesale.
#
# The panic-family matters more here than anywhere else in the tree: this binary runs on the
# agent's critical path with `panic = "abort"`, and a panic is a non-zero exit, which Claude Code
# surfaces as a broken turn. The contract is "never fail loudly" — these make the compiler hold
# us to it.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `multiple_crate_versions` (cargo): zero dependencies, so it can only ever fire on a
#   toolchain artefact outside our control.
multiple_crate_versions = "allow"
