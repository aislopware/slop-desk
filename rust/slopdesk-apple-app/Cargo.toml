# `slopdesk-apple-app` — `NSRunningApplication`, and nothing else.
# Read `docs/57-apple-frameworks-in-rust.md` before changing it.
#
# ## What lives here
# One question: what is the bundle identifier of the process with this pid. That is
# `NSRunningApplication(processIdentifier:)`'s answer and no other API's — the pid itself comes from
# the WindowServer through `slopdesk-apple-cgwindow`, and the rules over the answer (is this bundle
# swipe-nav eligible) are `slopdesk-video`'s, which forbids `unsafe` and always will.
#
# ## What is deliberately NOT here: `NSWorkspace.frontmostApplication`
# It is a per-process SNAPSHOT. It populates on first access and then updates only through AppKit
# run-loop machinery a daemon never pumps, so every later read answers the first-access app forever
# — probe-verified: with Chrome frontmost, a daemon launched from Terminal read `com.apple.Terminal`
# on every call, on and off the main thread, while a side-by-side window-list scan tracked
# Chrome→Finder→Chrome live. That freeze made the swipe-nav status push report `eligible=false` for
# the daemon's whole life. The election is the window list's; this crate resolves a pid it is given.
#
# ## The `unsafe` in this crate: NONE
# `objc2-app-kit` generates `NSRunningApplication::runningApplicationWithProcessIdentifier` and
# `bundleIdentifier` SAFE, and reading an `NSString` through `to_string` is safe. There is no
# `#[expect(unsafe_code)]` anywhere in it, which is what `docs/57` §3 hopes for and what the
# `cgevent` spike first showed: most of this family's calls are safe in the bindings already.
#
# ## macOS ONLY, and how that is kept true
# `slopdesk-ffi` links this behind `[target.'cfg(target_os = "macos")'.dependencies]`, its door is
# declared inside `slopdesk_ffi.h`'s `MACOS-ONLY BEGIN/END` region, and `slopdesk-gate ffi`
# requires that symbol PRESENT on the macOS slice and ABSENT on both iOS slices.
[workspace]
resolver = "3"

[package]
name = "slopdesk-apple-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "NSRunningApplication reads for slopdesk — a pid in, a bundle id out"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_apple_app"
path = "src/lib.rs"

# PINNED EXACTLY, for the reason `slopdesk-apple-cgevent` gives: `objc2`'s MSRV is documented as
# explicitly NOT policy, so a caret range would let a routine `cargo update` raise the toolchain
# floor of a repository that builds three slices in CI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSRunningApplication",
  # The two EFFECT verbs stage E moved here — see the module note on why an effect is not the
  # snapshot `frontmostApplication` is barred for.
  "NSWorkspace",
  # `runningApplicationWithProcessIdentifier:` is gated on this: the binding takes a `libc::pid_t`,
  # so without the feature the generated function is simply absent rather than taking an `i32`.
  "libc",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSString",
  # `NSURL` is what `openURL:` and `activateFileViewerSelectingURLs:` take, and the second takes an
  # `NSArray` of them.
  "NSURL",
  "NSArray",
] }

# Mirrors the other two read crates': this is linked into the same archive.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block every workspace carries. `unsafe_code` is `deny` rather than `forbid` only
# because §3 asks every crate in this family for the same two levels; this crate writes none.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason — the same two every workspace disables, for the same two reasons.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
