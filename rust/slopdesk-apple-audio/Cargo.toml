# `slopdesk-apple-audio` — **AudioToolbox**, the AAC-ELD codec on both ends of the wire.
# Read `docs/57-apple-frameworks-in-rust.md` before changing it, ESPECIALLY §2's amendment.
#
# ## What lives here
# Building an `AudioConverter` for AAC-ELD in each direction, staging the bitrate, fetching the
# magic cookie the client needs to decode, feeding the converter one block at a time, and reading a
# captured sample buffer's samples out of the buffer list they arrive in. Nothing else. Every RULE
# — the wire cadence, the fold to stereo, the 480-frame chunking, the `s16le` pack and its decode —
# is `slopdesk-video`'s `audio_source` and `audio_wire`, both `forbid(unsafe_code)`, both tested
# headlessly. This crate reads them.
#
# The codec-free `s16le` arm never reaches this crate at all: it is a pure sample-format convert
# with no state, so it lives entirely in `slopdesk-video` and the door calls it directly.
#
# ## The `unsafe` in this crate, and why §2 was amended for it
# `docs/57` §2 forbids a `slopdesk-apple-*` crate from hand-writing a raw-pointer dereference. Every
# other crate in the family clears that bar because the frameworks it calls hand out OBJECTS —
# `objc2` models those, and the binding answers the ownership question. AudioToolbox hands out
# SAMPLE MEMORY. `AudioConverterFillComplexBuffer` takes a C input proc that must write a packet
# count through a `NonNull<u32>` and a buffer descriptor through a `NonNull<AudioBufferList>`, and
# there is no block-based alternative anywhere in the framework family: `AVAudioConverter`'s
# block API reaches the same samples through `floatChannelData`, which is a `*mut NonNull<c_float>`.
# There is no version of this crate without raw-pointer work, and the operation cannot move to one
# of the three hand-unsafe crates either — `slopdesk-ffi` already depends on this family, so the
# reverse edge is a cycle.
#
# So the amendment is narrow: raw-pointer work is allowed HERE, and only on Core Audio sample
# memory. Every other §2 obligation is unchanged and is carried in full — `deny(unsafe_op_in_
# unsafe_fn)`, one `# Safety` note per block naming the FRAMEWORK rule it satisfies rather than a
# Rust one, and a leak test over every object this crate creates.
#
# ## Why a test can reach so little of this
# An `AudioConverter` is an in-process codec: no window server, no device, no TCC. So unlike the
# capture and encode crates, the converters here ARE built under `cargo test` — what a test cannot
# do is assert what the codec produced, because AAC-ELD output is not specified bit-for-bit. The
# suite therefore pins the shapes around it: the descriptions built, the refusals, the cookie's
# presence, the block cadence, and the leak counts.
[workspace]
resolver = "3"

[package]
name = "slopdesk-apple-audio"
version = "0.1.0"
edition = "2024"
publish = false
description = "AAC-ELD encode and decode through AudioToolbox for slopdesk — the calls, no decisions"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_apple_audio"
path = "src/lib.rs"

# PINNED EXACTLY, all of them, for the reason `slopdesk-apple-cgevent` gives: `objc2`'s MSRV is
# documented as explicitly NOT policy, so a caret range would let a routine `cargo update` raise the
# toolchain floor of a repository that builds three slices in CI.
[dependencies]
objc2-audio-toolbox = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2-core-audio-types",
  "AudioConverter",
] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFBase",
] }
# Reading the captured buffer's samples. The same framework the capture crate reads its frames
# through, and for the same reason: a sample buffer is how a delivery arrives, whichever half of it
# the reader wants.
objc2-core-media = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CMBase",
  "CMBlockBuffer",
  "CMFormatDescription",
  "CMSampleBuffer",
  "objc2-core-audio-types",
] }
# Every rule these calls are made under: the wire cadence, the stereo fold, the chunking, the pack.
slopdesk-video = { path = "../slopdesk-video" }

# Mirrors `slopdesk-video`'s: this is linked into the same archive.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block every workspace carries. `unsafe_code` is `deny` rather than `forbid` because
# every site sits under its own self-expiring `#[expect(unsafe_code, reason = …)]`, so an exemption
# that stops being needed fails the build. `unsafe_op_in_unsafe_fn` is `deny` on top, per §3.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# `redundant_pub_crate` stays DENIED here: the two modules it fires in, `asbd` and `converter`, carry
# the conflict with the denied `unreachable_pub` and the `#![expect]` that resolves it, at the site.
# The old crate-wide allow named `sample`, a module the lint does not fire in at all — which is the
# whole argument for keeping the exemption where it can be checked.
# Disabled, with a reason — the same two every workspace disables, for the same two reasons.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
