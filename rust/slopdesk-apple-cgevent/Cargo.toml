# `slopdesk-apple-cgevent` — the FIRST crate of the `slopdesk-apple-*` family, and the one that
# pays for the family existing. Read `docs/57-apple-frameworks-in-rust.md` before changing it.
#
# ## What lives here
# CoreGraphics event synthesis, and nothing else: build a mouse/scroll/keyboard `CGEvent`, set the
# fields the injected event needs, warp the cursor, post at the HID tap. No decision is made in this
# crate — which event to build, whether to warp, whether a duplicate release is suppressed, are all
# `slopdesk-video`'s rules, which is `forbid(unsafe_code)` and always will be.
#
# ## Why it is allowed `unsafe` when only three crates are
# It is not one of the three. `CLAUDE.md`'s rule names three crates that may HAND-WRITE `unsafe`;
# this is the other family, which may only write `unsafe` to call an `objc2` binding that is itself
# `unsafe`. Exactly ONE call in this crate qualifies — `CGEvent::keyboard_set_unicode_string`, the
# raw-pointer door for Unicode text injection. Every other call it makes is safe Rust, because
# `objc2-core-graphics` 0.3.2 generates them safe: 31 of `CGEvent`'s 38 functions, and all of
# `CGEventSource`'s and `CGRemoteOperation`'s.
#
# ## Why the event source is a thread-local and not a global
# `CFRetained<CGEventSource>` is not `Sync`, and it should not be forced to be. The source is a
# handle onto the `hidSystemState` the whole system shares, so two of them are not two states —
# they are two handles onto one. A thread-local therefore costs one CF allocation per posting
# thread (there are two: the session's serial queue and the scroll pump) and buys the absence of a
# lock on the hottest path in the product, which is a pointer move at roughly 150 per second.
#
# ## macOS ONLY, and how that is kept true
# `slopdesk-ffi` links this behind `[target.'cfg(target_os = "macos")'.dependencies]`, its doors are
# declared inside `slopdesk_ffi.h`'s `MACOS-ONLY BEGIN/END` region, and `slopdesk-gate ffi`
# requires those symbols PRESENT on the macOS slice and ABSENT on both iOS slices. That is the same
# three-way bijection `slopdesk-git` takes and the only route `docs/57` §3 permits.
[workspace]
resolver = "3"

[package]
name = "slopdesk-apple-cgevent"
version = "0.1.0"
edition = "2024"
publish = false
description = "CoreGraphics event synthesis for slopdesk — build, warp and post, no decisions"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_apple_cgevent"
path = "src/lib.rs"

# PINNED EXACTLY, both of them. `objc2`'s MSRV is documented as explicitly NOT policy — it may move
# in a patch release — so a caret range would let a routine `cargo update` raise the toolchain floor
# of a repository that builds three slices in CI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGError",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
  "libc",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFBase",
  "CFCGTypes",
] }
# The pure rules this crate translates into effects. The clamp that keeps a hostile wire delta from
# trapping an `i32` conversion is `slopdesk-video`'s, not this crate's — see `input_routing`.
slopdesk-video = { path = "../slopdesk-video" }

# Mirrors `slopdesk-video`'s: this is linked into the same archive.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block every workspace carries. `unsafe_code` is `deny` rather than `forbid` for the
# reason `slopdesk-posix` and `slopdesk-gfsimd` give: every site sits under its own self-expiring
# `#[expect(unsafe_code, reason = …)]`, so an exemption that stops being needed fails the build.
# `unsafe_op_in_unsafe_fn` is `deny` on top, per `docs/57` §3.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason — the same two every workspace disables, for the same two reasons.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
