# `slopdesk-apple-cgvirtualdisplay` — CoreGraphics' **virtual display** area, the write side.
# Read `docs/57-apple-frameworks-in-rust.md` before changing it.
#
# ## What lives here
# The four `CGVirtualDisplay*` Objective-C classes and nothing else: resolve them, build a
# descriptor, build a settings object with its modes, register the display, force it to EXTEND
# rather than mirror, and hold the one reference whose lifetime IS the registration. Every NUMBER
# those objects are filled with — the point grid, the pixel framebuffer, the millimetre size, the
# advertised refresh rates, where the display sits in the global space — is `slopdesk-video`'s
# `virtual_display`, which is `forbid(unsafe_code)` and golden-pinned. This crate re-exports its
# `Geometry` rather than owning a second one.
#
# It is a SEPARATE crate from `slopdesk-apple-cgdisplay` even though both are CoreGraphics, because
# §2's unit is one framework AREA and these are two: display services READS which displays exist,
# this one CREATES one. It depends on that crate for the pre-create snapshot rather than spelling
# the two-call enumeration a second time.
#
# ## The `unsafe` in this crate
# All of it is `objc2`'s own runtime machinery. The four classes are private — they have no
# generated bindings — so each object is reached as an `AnyObject` through
# `AnyClass::get(c"CGVirtualDisplay…")` plus `msg_send!`. There is NO `transmute`, NO
# `slice::from_raw_parts`, NO `ptr::read` and NO hand-declared `extern` signature anywhere in it,
# and NEITHER CoreFoundation admission (§2's `CFRetained::from_raw` / `CFRetained::retain`) is
# spent: every object arrives as an Objective-C `Retained` from a message send, so the ownership
# convention is the one `msg_send!` already encodes. The obligation each site carries is the
# Objective-C runtime's — the selector exists on the resolved class, and the argument types match
# its declared encoding — never a Rust memory rule.
#
# The `unsafe impl Send`/`Sync` pair is the other kind: a per-class judgement about the framework,
# which `objc2` cannot make on anyone's behalf. Its note names the framework rule it rests on.
#
# ## macOS ONLY, and how that is kept true
# `slopdesk-ffi` links this behind `[target.'cfg(target_os = "macos")'.dependencies]`, its doors are
# declared inside `slopdesk_ffi.h`'s `MACOS-ONLY BEGIN/END` region, and `slopdesk-gate ffi`
# requires those symbols PRESENT on the macOS slice and ABSENT on both iOS slices.
[workspace]
resolver = "3"

[package]
name = "slopdesk-apple-cgvirtualdisplay"
version = "0.1.0"
edition = "2024"
publish = false
description = "CoreGraphics virtual-display registration for slopdesk — the HiDPI capture surface"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_apple_cgvirtualdisplay"
path = "src/lib.rs"

# PINNED EXACTLY, for the reason `slopdesk-apple-cgevent` gives: `objc2`'s MSRV is documented as
# explicitly NOT policy, so a caret range would let a routine `cargo update` raise the toolchain
# floor of a repository that builds three slices in CI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSString",
  "NSValue",
  "NSArray",
  "NSObject",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGError",
  "libc",
] }
# `objc2` on top of the geometry types, because `CGPoint`/`CGSize` are MESSAGE ARGUMENTS here — the
# descriptor's primaries and its millimetre size are properties, and an argument needs an encoding.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "objc2",
  "CFBase",
  "CFCGTypes",
] }
# The termination handler is an Objective-C BLOCK property, and the descriptor's delivery target is
# a dispatch queue; neither has a safe stand-in.
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = [
  "std",
  "objc2",
] }
# The pre-create snapshot: one enumeration of the physical displays in the repository, not a second
# copy of the two-call `CGGetOnlineDisplayList` dance.
slopdesk-apple-cgdisplay = { path = "../slopdesk-apple-cgdisplay" }
# The arithmetic half. `Geometry`, `origin_to_right` and `refresh_rates` are golden-pinned there;
# this crate re-exports them and never re-spells one.
slopdesk-video = { path = "../slopdesk-video" }

# Mirrors `slopdesk-video`'s: this is linked into the same archive.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block every workspace carries. `unsafe_code` is `deny` rather than `forbid` because
# every site sits under its own self-expiring `#[expect(unsafe_code, reason = …)]`, so an exemption
# that stops being needed fails the build. `unsafe_op_in_unsafe_fn` is `deny` on top, per §3.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason — the same two every workspace disables, for the same two reasons.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
