# `slopdesk-apple-cgwindow` — CoreGraphics **Window Services**, the read side.
# Read `docs/57-apple-frameworks-in-rust.md` before changing it.
#
# ## What lives here
# `CGWindowListCopyWindowInfo` and the decode of what it answers: a `CFArray` of `CFDictionary`
# turned into plain Rust records. Nothing else. The rules OVER those records — who counts as
# frontmost, which occluder is an attached panel — are `slopdesk-video`'s, which is
# `forbid(unsafe_code)` and always will be.
#
# Four call sites in the host each hand-decoded this same dictionary in Swift, each with its own
# spelling of "missing field ⇒ drop the record". There is one decode now.
#
# ## The `unsafe` in this crate, all three blocks of it
# `objc2-core-graphics` generates `CGWindowListCopyWindowInfo` SAFE, and every CoreFoundation
# accessor the decode uses — `CFArray::get`, `CFDictionary::get`, `CFRetained::downcast`,
# `CFNumber::as_i64`, `CFString`'s `Display` — is safe too. Exactly three things are not, and each
# is the FRAMEWORK's contract rather than Rust's:
#
# 1. Reading the `kCGWindow*` key constants. They are `extern` statics, so Rust cannot prove they
#    are initialised; CoreGraphics guarantees they are, at image load.
# 2. Naming the element type of the returned array. The binding answers an untyped `CFArray`
#    because C's `CFArrayRef` carries no element type; the documentation is what says every element
#    is a `CFDictionary` keyed by `CFString`. One `cast_unchecked` states that, once, and every read
#    after it is type-checked by CoreFoundation itself.
# 3. The same, for the `CGRect` dictionary a record's bounds field holds — and there the value is
#    checked against `CFDictionaryGetTypeID` first, so only the key and value types are asserted.
#
# None of the three dereferences a pointer, transmutes, or takes ownership of a raw one, which is
# the line `docs/57` §2 draws for this family.
#
# ## macOS ONLY, and how that is kept true
# `slopdesk-ffi` links this behind `[target.'cfg(target_os = "macos")'.dependencies]`, its doors are
# declared inside `slopdesk_ffi.h`'s `MACOS-ONLY BEGIN/END` region, and `slopdesk-gate ffi`
# requires those symbols PRESENT on the macOS slice and ABSENT on both iOS slices. That is the same
# three-way bijection `slopdesk-git` and `slopdesk-apple-cgevent` take, and the only route
# `docs/57` §3 permits.
[workspace]
resolver = "3"

[package]
name = "slopdesk-apple-cgwindow"
version = "0.1.0"
edition = "2024"
publish = false
description = "CoreGraphics window-list reads for slopdesk — one decode, no decisions"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_apple_cgwindow"
path = "src/lib.rs"

# PINNED EXACTLY, both of them, for the reason `slopdesk-apple-cgevent` gives: `objc2`'s MSRV is
# documented as explicitly NOT policy, so a caret range would let a routine `cargo update` raise the
# toolchain floor of a repository that builds three slices in CI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGWindow",
  "libc",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFBase",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
# The rules this crate's records are read BY. The frontmost election — layer, pid, alpha, first one
# wins — is `slopdesk-video`'s `window_list`, not this crate's.
slopdesk-video = { path = "../slopdesk-video" }

# Mirrors `slopdesk-video`'s: this is linked into the same archive.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block every workspace carries. `unsafe_code` is `deny` rather than `forbid` because
# every site sits under its own self-expiring `#[expect(unsafe_code, reason = …)]`, so an exemption
# that stops being needed fails the build. `unsafe_op_in_unsafe_fn` is `deny` on top, per §3.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason — the same two every workspace disables, for the same two reasons.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
