# `slopdesk-apple-metal` — **Metal**, and the `CAMetalLayer` that presents it.
# Read `docs/57-apple-frameworks-in-rust.md` and `docs/68-terminal-surface-in-rust.md` §10.1 before
# changing it.
#
# ## What lives here
# The device, the command queue, the layer, the shader library, the two pipeline states, the
# instance buffers and the two atlas textures. One entry point draws one frame. Nothing decides
# anything: WHERE a cell background goes, WHICH atlas a glyph came from, whether a cursor is a fill
# or an outline, how wide an underline is — every one of those is `slopdesk-termrender`, which is
# `forbid(unsafe_code)` and stays that way. This crate reads a `DrawList` and issues three draws.
#
# ## The `unsafe` in this crate, and the one site that is not a call
# `objc2-metal` generates most of the surface SAFE — creating a device, a queue, a library, a
# pipeline state, a texture, a render pass and a command buffer costs zero `unsafe`, and so does
# every `CAMetalLayer` accessor this crate touches. What is left `unsafe` upstream is the family
# whose C signature carries a bare pointer or an unchecked index: `setVertexBuffer:offset:atIndex:`,
# `setVertexBytes:length:atIndex:`, `setFragmentTexture:atIndex:`,
# `drawPrimitives:vertexStart:vertexCount:instanceCount:`, `replaceRegion:mipmapLevel:withBytes:…`,
# `objectAtIndexedSubscript:` and `addCompletedHandler:`. Each of those is a CALL, which is what
# `docs/57` §2 allows.
#
# ONE site is not a call, and it is worth naming in the manifest because it is a live tension with
# that section rather than a settled thing: `frames::Ring::fill` writes an instance slice through
# `MTLBuffer::contents()`. Metal publishes a buffer's shared copy as a bare pointer and offers no
# copy-in for a buffer that already exists — the same "the framework hands out MEMORY rather than an
# object" shape that put `slopdesk-apple-audio` and `slopdesk-apple-vt` on `crate_policy.rs`'s
# exempt list. This crate is NOT on that list, and `docs/57` §2 says a third joins "by a change to
# this paragraph". That change is a review, not a commit this crate may make for itself. See
# `src/frames.rs`'s header for the three-route test.
[workspace]
resolver = "3"

[package]
name = "slopdesk-apple-metal"
version = "0.1.0"
edition = "2024"
publish = false
description = "The GPU half of the slopdesk terminal surface — the device, the layer, the pipelines"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_apple_metal"
path = "src/lib.rs"

# PINNED EXACTLY, all of them, for the reason `slopdesk-apple-cgevent` gives: `objc2`'s MSRV is
# documented as explicitly NOT policy, so a caret range would let a routine `cargo update` raise the
# toolchain floor of a repository that builds three slices in CI. `objc2` itself is `=0.6.4` and the
# framework crates are `=0.3.2` — the pins every other `slopdesk-apple-*` manifest carries.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSNull",
  "NSObject",
  "NSString",
] }
# The feature list is the framework area, spelled out. Nothing here reaches compute, ray tracing,
# indirect command buffers, heaps or argument encoders — a terminal draws two pipelines' worth of
# instanced quads, and a wider default set would be a wider crate for a reviewer to hold.
objc2-metal = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLDevice",
  "MTLDrawable",
  "MTLLibrary",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResource",
  "MTLTexture",
  "MTLTypes",
  "bitflags",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
  "std",
  "bitflags",
  "CALayer",
  "CAMediaTiming",
  "CAMetalLayer",
  # `drawableSize` and `contentsScale` are `CGSize` and `CGFloat`, and in this generation of the
  # bindings Quartz's geometry travels through Core Foundation rather than through Foundation.
  "objc2-core-foundation",
  "objc2-metal",
] }
# `CGSize` and `CGRect`, which is how a layer is sized. Quartz types travel through
# `objc2-core-foundation` in this generation of the bindings rather than through Foundation.
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFBase",
  "CFCGTypes",
] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
# The frame fence. `DispatchSemaphore::{new, wait, signal}` are all SAFE bindings, so bounding the
# CPU's run-ahead costs this crate no `unsafe` at all.
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }

# The contract. A one-way dependency and the reason this crate has no arithmetic worth testing:
# `DrawList`, `GlyphCache` and `Atlas` arrive already correct, from a crate that tests them with no
# display attached.
[dependencies]
slopdesk-termrender = { path = "../slopdesk-termrender" }

# Mirrors `slopdesk-termrender`'s: drawing is the budget (`docs/68` §6), and this is linked into a
# long-lived app rather than forked per event.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# ---------------------------------------------------------------------------- #
# The strict block every workspace carries. `unsafe_code` is `deny` rather than `forbid` because
# every site sits under its own self-expiring `#[expect(unsafe_code, reason = …)]`, so an exemption
# that stops being needed fails the build. `unsafe_op_in_unsafe_fn` is `deny` on top, per §3.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason — the same three every workspace disables, for the same reasons.
# `suboptimal_flops`/`imprecise_flops` both want `f64::mul_add`, which is exactly the fused
# multiply-add `CLAUDE.md` forbids, and this crate converts pixels to clip space.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
