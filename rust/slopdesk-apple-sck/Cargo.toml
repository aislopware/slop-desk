# `slopdesk-apple-sck` — **ScreenCaptureKit**, the whole capture side of the host.
# Read `docs/57-apple-frameworks-in-rust.md` before changing it.
#
# ## What lives here
# Asking the window server what is shareable, building the three content filters and the stream
# configuration, creating the stream, starting and stopping it, reconfiguring a live one, and
# reading what each delivered sample buffer IS. Nothing else. Every rule those calls are made
# UNDER — the delivery ceiling, the surface depth, which filter a parked window wants, whether a
# resize may happen in place, where a moved window's crop belongs — is `slopdesk-video`'s
# `capture_config`, which is `forbid(unsafe_code)` and always will be.
#
# The Swift this replaces conceded in its own header that it was "COMPILED and code-reviewed but
# its `start()` is NEVER called from a test": an `SCStream` cannot start without a window server and
# a Screen-Recording grant. That is still true, and it is exactly why the split matters. The rules
# are now in a crate that runs headless under `cargo test`; what is left here is the part no test
# was ever going to reach anyway.
#
# ## The `unsafe` in this crate
# `objc2-screen-capture-kit` generates almost everything `unsafe`, because ScreenCaptureKit's own
# header does not say which arguments may be null or which methods may be sent off the main thread.
# So the blocks here are dense, and each one names the FRAMEWORK rule it is satisfying rather than a
# Rust one. Two shapes recur:
#
# 1. Sending a message whose receiver and arguments this crate just built. The obligation is the
#    method's own documented contract — a filter outlives the stream it configures, a configuration
#    may be rewritten while a stream is running, an output may be added only before capture starts.
# 2. Reading a `kCM*`/`SCStreamFrameInfo*` key constant. They are `extern` statics; the frameworks
#    initialise them at image load, which Rust cannot see.
#
# Not one of them dereferences a pointer, transmutes, or takes ownership of a raw one — the line
# `docs/57` §2 draws for this family. Neither Core Foundation admission is spent either: every
# accessor this crate reaches for is generated returning `CFRetained` already, so the ownership
# question was answered by the binding rather than by us.
#
# ## The queues belong to the CALLER
# `addStreamOutput:type:sampleHandlerQueue:` takes the queue each output delivers on, and this
# crate never makes one. The frame queue is the same serial queue the host's static-IDR timer runs
# on — that shared queue IS the discipline that lets the capture callback and the timer touch the
# same cached frame with no lock — and the audio queue is a second one so a slow synchronous encode
# cannot delay a 10 ms audio buffer. Both arrive through `slopdesk-ffi`, which is where the question
# "is this pointer from Swift live for the call" already lives.
#
# ## macOS ONLY, and how that is kept true
# `slopdesk-ffi` links this behind `[target.'cfg(target_os = "macos")'.dependencies]`, its doors are
# declared inside `slopdesk_ffi.h`'s `MACOS-ONLY BEGIN/END` region, and `slopdesk-gate ffi`
# requires those symbols PRESENT on the macOS slice and ABSENT on both iOS slices. Capture is the
# host's; no client slice has a window server to point at.
[workspace]
resolver = "3"

[package]
name = "slopdesk-apple-sck"
version = "0.1.0"
edition = "2024"
publish = false
description = "ScreenCaptureKit window and display capture for slopdesk — the calls, no decisions"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_apple_sck"
path = "src/lib.rs"

# PINNED EXACTLY, all of them, for the reason `slopdesk-apple-cgevent` gives: `objc2`'s MSRV is
# documented as explicitly NOT policy, so a caret range would let a routine `cargo update` raise the
# toolchain floor of a repository that builds three slices in CI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSError",
  "NSObject",
  "NSString",
  "block2",
] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  # `SCRunningApplication.processID` is typed `libc::pid_t`, and the binding is behind this feature.
  # The pid is the one fact the Accessibility API needs before it can move a window: AX is addressed
  # per PROCESS, so a window id alone cannot reach it.
  "libc",
  "dispatch2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
  "SCError",
  "SCShareableContent",
  "SCStream",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFBase",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGColorSpace",
  "CGDirectDisplay",
  "CGWindow",
  "libc",
] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CMBase",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMSync",
  "CMTime",
  "objc2-core-video",
] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
# Display bounds, read through Quartz. A display-anchored crop compares a window's frame against
# its display's, and this is the crate that already promises those two rectangles share a space.
slopdesk-apple-cgdisplay = { path = "../slopdesk-apple-cgdisplay" }
# The rules these calls are made under. Every clamp, every default, every choice of filter is
# `capture_config`'s — this crate reads a `CaptureSpec` and builds what it says.
slopdesk-video = { path = "../slopdesk-video" }

# Mirrors `slopdesk-video`'s: this is linked into the same archive.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block every workspace carries. `unsafe_code` is `deny` rather than `forbid` because
# every site sits under its own self-expiring `#[expect(unsafe_code, reason = …)]`, so an exemption
# that stops being needed fails the build. `unsafe_op_in_unsafe_fn` is `deny` on top, per §3.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# `redundant_pub_crate` stays DENIED here: the five modules it fires in — `config`, `filter`, `frame`,
# `handoff`, `tap` — each carry the conflict with the denied `unreachable_pub` and the `#![expect]`
# that resolves it, at the site.

# Disabled, with a reason — the same two every workspace disables, for the same two reasons.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
