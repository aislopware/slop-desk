# `slopdesk-client` — the interactive remote terminal, as a process.
#
# ## Why it is its own bin and not a `slopdesk` subcommand
# The shipped name is release-facing (`docs/49`) and `docs/63` §G.5 declines the rename: the stage
# ports an implementation, and a binary that changes its name mid-port is a second change wearing
# the first one's clothes. So this keeps the name the Swift executable had and takes its place.
#
# ## Why it is its OWN workspace root and not a member like `slopdesk-cli`
# `slopdesk-cli`'s header argues that a short-lived program wants the root workspace's
# `opt-level = "z"` / `panic = "abort"`: startup is the whole cost and the process IS the request.
# Neither half holds here. This process is a per-byte relay that lives as long as a shell session —
# every keystroke and every frame of output crosses it — so it wants the client profile every other
# crate on that path already carries, which is `slopdesk-clientdriver`'s: `opt-level = 3`, thin LTO,
# and `panic = "unwind"` so a panic on the stdin thread unwinds that thread rather than killing a
# session with an unrestored terminal.
#
# ## Five dependencies, and each is one part of the process
# `slopdesk-clientdriver` is the session — the transport, the tickers, the reconnect campaign and
# the output inbox. `slopdesk-clientnet` is the pool it dials over, through `DiallingPool`, which is
# the shipping dial closure written once for this bin and for `slopdesk-ffi`'s. `slopdesk-posix` is
# the termios save-and-restore and `write(2)`-until-done. `slopdesk-wire` is the `WireMessage` the
# observer matches on. `slopdesk-ids` is `parse_uuid`, so `--session-id` costs no `uuid` crate.
#
# `nix` is here for ONE thing: `SigSet::wait`, the synchronous SIGWINCH wait. It is a SAFE wrapper,
# so by `slopdesk-posix`'s own admission test — "a syscall with no safe wrapper in `std` or `nix`" —
# it does not get a door in that crate; it is called from here directly.
[workspace]

[package]
name = "slopdesk-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "The interactive remote terminal client: raw mode, two byte pumps and a resize, over one pane driver"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-client"
path = "src/main.rs"

[lib]
name = "slopdesk_client"
path = "src/lib.rs"

[dependencies]
slopdesk-clientdriver = { path = "../slopdesk-clientdriver" }
slopdesk-clientnet = { path = "../slopdesk-clientnet" }
slopdesk-ids = { path = "../slopdesk-ids" }
slopdesk-posix = { path = "../slopdesk-posix" }
slopdesk-wire = { path = "../slopdesk-wire" }

libc = "0.2"
nix = { version = "0.31", features = ["signal"] }

# The session's own profile, copied from `slopdesk-clientdriver` because this process IS that
# driver's byte path with a terminal on the near end.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block, copied rather than inherited — inheriting would mean being a workspace member,
# which is what the profile above forbids.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# The whole of this binary's contact with the kernel goes through `slopdesk-posix` and `nix`, so
# `forbid` costs nothing and is the form of the promise no downstream `allow` can lift.
# `exit` stays DENIED even though this is a process: `main` answers an `ExitCode` and every path
# returns to it, so the terminal is restored by a `Drop` that actually runs. The Swift's `finish()`
# called `exit(3)` from inside a closure, which is exactly why it needed a hand-written `Shutdown`
# type to put the tty back first.
# Both stay denied, and neither is a hardship: terminal bytes go out with
# `slopdesk_posix::fdio::write_all` on the raw descriptor (a `println!` would line-buffer a prompt
# that has no newline into invisibility), and status lines go out with `writeln!` on a locked
# stderr, which is what `slopdesk-cli`'s `diagnose` already does.
# Disabled, with the same reason every crate in this lane carries: both nursery lints want
# `f64::mul_add`, the fused multiply-add `CLAUDE.md` forbids. Nothing here does arithmetic on a
# float at all — the round-trip reading is `slopdesk-clientdriver`'s and this binary does not even
# render it — but the opt-out is a WORKSPACE-level promise the gate reads per workspace, so a crate
# that is its own root states it whether or not it has a float today.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
