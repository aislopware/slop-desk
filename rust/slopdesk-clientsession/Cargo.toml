# `slopdesk-clientsession` — the decision half of one pane's CLIENT session.
#
# ## Why a crate rather than a module of an existing one
# `slopdesk-wire` carries what a frame LOOKS like, and `slopdesk-muxsession` carries what a HOSTD
# pane session decides. Neither is this: the dedup high-water mark, the resume verdict, the ack gate
# and the retry ladder are what the CLIENT decides about a stream the host is sending it, and the
# only thing they share with the wire is the seq field they read. Putting them in `slopdesk-wire`
# would put a retry schedule underneath a golden-pinned protocol; putting them in
# `slopdesk-muxsession` would point the host's crate at the client's questions.
#
# It depends on NOTHING. Four numbers, a flag and a ladder — a crate this small is the point rather
# than an accident: the whole of it can be read in a sitting, and every rule in it is one a socket
# would otherwise have to be stood up to exercise.
#
# ## Why it is worth moving at all
# `Sources/SlopDeskClient` is not UI. It is an actor with four background tasks, and underneath them
# a table of cases whose every failure is silent: a seq accepted twice, a mark cleared at the wrong
# moment, a transport adopted over a live one. `forbid(unsafe_code)` and the panic denials below are
# doing real work on code a network peer's seq numbers reach.

[workspace]
resolver = "3"

[package]
name = "slopdesk-clientsession"
version = "0.1.0"
edition = "2024"
publish = false
description = "The dedup, ack, resume and retry decisions of one slopdesk pane's client session"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_clientsession"
path = "src/lib.rs"

# The session driver folds one of these per inbound frame, on the pane's byte path.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml`. A literal copy rather than inherited, because
# inheriting would mean being a member, which is what the profile above forbids.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): no dependencies at all, so it can only ever fire on a
#   toolchain artefact outside our control.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids. The smoothed round trip is the value it would change:
#   FMA rounds once where the wire rounds twice, so taking the advice makes a different number.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
