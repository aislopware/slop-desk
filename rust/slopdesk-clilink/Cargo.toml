# `slopdesk-clilink` — installs the `slopdesk` command where the user's shell already looks.
#
# ## Why it is a crate of its own
# It is an effect on the filesystem, which makes it Rust's, and it belongs to no existing subject in
# this graph. Not `slopdesk-cli`, whose lib is the command's argv grammar and completions — linking
# that into the app would pull a parser into a GUI for twenty lines of `std::fs`. Not
# `slopdesk-provision`, which is the only thing in the tree that opens a socket to the internet and
# runs from `just provision` alone. A crate is the smallest thing that can hold this without
# lending it a subject it does not have.
#
# It carries no dependency at all — `std::fs` and `std::os::unix::fs` are the whole of it.
[workspace]
resolver = "3"

[package]
name = "slopdesk-clilink"
version = "0.1.0"
edition = "2024"
publish = false
description = "Links the bundled `slopdesk` command into the user's own bin directory"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_clilink"
path = "src/lib.rs"

# Runs once, at launch, before the first window.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"

# ---------------------------------------------------------------------------- #
# The same maximal-strict set every other crate carries, copied rather than inherited for the same
# reason they copy it: inheriting means membership, and membership means sharing a profile.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
