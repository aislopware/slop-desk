# `slopdesk-clipboard` — the four rules that turn a system pasteboard into a wire clip, said once.
#
# ## Why it is a crate of its own
# Clipboard sync has two ends and they must agree byte for byte: the HOST answers verbs 15/16 out of
# `slopdesk-hostserver`, and the CLIENT pushes and applies out of the `.xcframework` the two apps
# link. Both ends ask a board the same four questions — image before text, the codec's cap, never a
# file copy, and (on the push side only) never a concealed clip — and a disagreement in either is a
# drift in the PROTOCOL that no compiler sees. That is the exact shape `docs/55` §6 records for
# `process::basename`, where two implementations disagreed for a month.
#
# Neither end can host the rules for the other. `slopdesk-hostserver` is a daemon's crate and the
# `.xcframework` must not link it; `slopdesk-ffi` is the shim and a daemon must not link that. The
# rules cannot go in `slopdesk-wire` either: that crate is the PROTOCOL — the codec, the cap and the
# clip type — and a trait describing a machine's pasteboard is not protocol, it is what the protocol
# is fed by.
#
# So the fold is its own crate: one implementation, two consumers, no framework in sight. It names
# no Apple type and takes no `apple-*` edge, so it builds on a machine with no `AppKit` — which is
# what lets `cargo test` run every rule headlessly against a fake board.
[workspace]
resolver = "3"

[package]
name = "slopdesk-clipboard"
version = "0.1.0"
edition = "2024"
publish = false
description = "The pasteboard-to-wire-clip fold both ends of clipboard sync share"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_clipboard"
path = "src/lib.rs"

[dependencies]
# The clip type, its kind byte and the content cap. The whole point of the fold is that the cap is
# checked against the CODEC's number and typed nowhere else, so this edge is the crate's reason to
# exist rather than a convenience.
slopdesk-wire = { path = "../slopdesk-wire" }

# Linked into a long-lived daemon on one side and a client app on the other; neither wants a
# debug-shaped build of a fold this small.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The same maximal-strict set its two consumers carry, copied rather than inherited for the reason
# `slopdesk-altscreen` copies it: inheriting means membership, and membership means sharing a profile.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
