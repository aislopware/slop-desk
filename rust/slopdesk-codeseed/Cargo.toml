# `slopdesk-codeseed` — the code panel's workbench profile, owned by one program.
#
# ## Why this is its OWN workspace, sitting inside `rust/`
# Cargo profiles are workspace-global. The root workspace's release profile is tuned for a binary
# forked twice per tool call — `opt-level = "z"`, `panic = "abort"` — because the hook's whole cost
# is startup. This binary is forked ONCE per hostd boot and once per client font sync, and it
# carries ~400 KiB of embedded theme JSON: sizing its optimiser for a startup it does not pay would
# be optimising the wrong number, and `panic = "abort"` would turn a bad settings file into an
# abort where a non-zero exit is the honest report. Same reasoning superd's own workspace records.
[workspace]
resolver = "3"

[package]
name = "slopdesk-codeseed"
version = "0.1.0"
edition = "2024"
publish = false
description = "Seeds and repairs the code panel's code-server profile — settings, themes, the bridge extension"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-codeseed"
path = "src/main.rs"

[lib]
name = "slopdesk_codeseed"
path = "src/lib.rs"

[dependencies]
# Every artefact this program touches is a file the WORKBENCH also writes, so "canonical JSON" has
# to mean what the workbench's own reader accepts. serde_json's default map is a `BTreeMap`, which
# is the sorted-key form the Swift original produced with `.sortedKeys` — the drift comparisons
# depend on that, so the `preserve_order` feature must stay OFF.
serde_json = "1"

[lints]
workspace = true

[workspace.lints.rust]
# Nothing here needs a raw pointer: this is file and JSON work.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# The same curated slice of `restriction` the other workspaces opt into lint-by-lint.
#
# The panic family earns its place differently here. This program's whole contract is that a seed
# is a NICETY: every failure is a silent no-op and the workbench comes up unthemed rather than not
# at all. A panic would break that promise loudly, in a process hostd forked at boot.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `print_stdout`: stdout IS this program's return value. Every subcommand answers hostd with one
#   JSON object on it, so the lint would fire on the interface itself.
# - `multiple_crate_versions` (cargo): one dependency, so it can only fire on a toolchain artefact.
print_stdout = "allow"
multiple_crate_versions = "allow"
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
