# `slopdesk-devicelink` — the two SOCKETS the device panels hold open, and nothing they decide.
#
# ## Why it is its own crate
# `slopdesk-devicepanel` is the panels' RULES: the phase a state byte means, the aspect fit, the
# route table, the log severity ladder. It is `forbid(unsafe_code)`, it performs no I/O, and every
# function in it is a pure fold a test can drive without a machine. Putting a `TcpStream` and a
# reader thread in it would end that property for the whole crate.
#
# So this is the other half — the part that DIALS. It takes the route table's answer and turns it
# into bytes arriving on a sink, which is exactly the boundary the two Swift lanes drew between
# `SimulatorEndpoints` and `NWConnection`. `docs/63` §6 named those lanes and deferred them: "the
# device-panel and proxy lanes are their own campaigns and are not scoped here". This crate is that
# campaign.
#
# ## Two transports, one shape
# The simulator's two sockets speak RFC 6455 and the Android bridge's speaks a line then a stream.
# They share the shape that matters — dial, hand the caller a handle, run a reader on a thread of
# its own, deliver on a sink, and tear down so that no callback outlives the handle — so the
# lifetime rules are written once in `src/session.rs` and the two protocols are what differ.
[workspace]
resolver = "3"

[package]
name = "slopdesk-devicelink"
version = "0.1.0"
edition = "2024"
publish = false
description = "The device panels' two sockets: the simulator's websocket and the Android bridge's line-then-stream"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_devicelink"
path = "src/lib.rs"

[dependencies]
# The panel copy table, for the ONE sentence a socket has to word itself — a link that ended before
# the host had acked. Wording it here would be a second speller for a string the panel already
# reads from one place, which is the duplication that table exists to end.
slopdesk-devicepanel = { path = "../slopdesk-devicepanel" }

# SHA-1 and Base64, for `Sec-WebSocket-Accept`. Both are SPECIFICATIONS rather than decisions:
# RFC 6455 §4.1 makes validating that header a MUST, and a client that skipped it would treat a
# plain TCP echo as an upgraded socket. `sha1_smol` is the dependency-free one on purpose — this
# library is linked into the app, and the RustCrypto tree is six crates to compute twenty bytes
# once per dial. `base64` is the repo's one codec for this, the same version `slopdesk-wire` and
# `slopdesk-codepanel` take.
sha1_smol = "1"
base64 = "0.23"

# Linked into the app; the hot path is a frame header parse per message.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"

# ---------------------------------------------------------------------------- #
# The strict block, copied rather than inherited — inheriting would mean being a workspace member,
# which is what the profile forbids.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
