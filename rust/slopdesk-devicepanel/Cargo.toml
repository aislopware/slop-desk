# `slopdesk-devicepanel` — what the Android panel and the simulator panel DECIDE, once.
#
# ## Why it is its own crate
# The two panels are separate surfaces with separate transports, and they were separate Swift files
# holding the SAME rules — the ensure round's endpoint → the phase to render, and how long to wait
# before asking again, were byte-identical in both. That is the duplication `CLAUDE.md`'s "one
# implementation, never two languages" exists to end, and it had already happened inside one
# language.
#
# It is not part of `slopdesk-androidd`, for the reason `slopdesk-devicelog` gives about the log
# grammars: half of this is the simulator's, and the Android bridge has no business knowing what
# `baguette` reports. It is not part of `slopdesk-workspace` either, which is where the client's
# other broad rules live: this reads `slopdesk-wire`'s `ServiceState`, and `slopdesk-wire` already
# depends on `slopdesk-workspace` — the edge only goes one way.
#
# ## One dependency, and it is a vocabulary rather than a decision
# `slopdesk-wire` carries the ENSURE verb's answer: the state byte's three meanings and the
# forward-tolerant read of a fourth. A panel rule that mapped that byte itself would be a second
# copy of the mapping the host encodes against, so it takes the wire's type instead of the wire's
# bytes.
[workspace]
resolver = "3"

[package]
name = "slopdesk-devicepanel"
version = "0.1.0"
edition = "2024"
publish = false
description = "The shared decisions behind slopdesk's Android and simulator device panels"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_devicepanel"
path = "src/lib.rs"

[dependencies]
# The ENSURE verb's answer — the endpoint the phase rule reads, and the state byte's meaning. See
# the header: taking the type is what keeps this from being a second copy of the mapping.
slopdesk-wire = { path = "../slopdesk-wire" }

# Linked into the app; every rule here is a `match` on a handful of scalars.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"

# ---------------------------------------------------------------------------- #
# The strict block, copied rather than inherited — inheriting would mean being a workspace member,
# which is what the profile forbids.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
