# `slopdesk-devtools` — the operator tools that used to be Python.
#
# ## Why one crate and not three
# These three programs have nothing in common at the domain level: one re-syncs an upstream
# vendor's manifests and diffs two detect engines, one rewrites Swift access modifiers, one
# speaks the media wire over loopback UDP. What they DO share is the only property that decides
# where code lives here — they are short-lived operator tools that ship in nothing. None is a
# gate (`slopdesk-invariants` is where a gate goes), none is linked into the app, none is
# `execve`d by a daemon. Splitting them into three workspaces would triple the clippy and
# `cargo fmt` passes `just lint` walks to buy a boundary nobody crosses.
#
# ## Its own workspace, for the usual reason
# Profiles are workspace-global. The differential harness forks two release binaries some tens of
# thousands of times and holds the whole corpus in memory; `rust/Cargo.toml`'s `opt-level = "z"`
# startup-tuned profile is exactly wrong for it, and that profile is the entire reason the
# short-lived programs share a workspace in the first place.
[workspace]
resolver = "3"

[package]
name = "slopdesk-devtools"
version = "0.1.0"
edition = "2024"
publish = false
description = "Operator tools: the release pipeline, the build gates, the herdr parity harness, the Swift access raiser, the input synclient"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_devtools"
path = "src/lib.rs"

[[bin]]
name = "slopdesk-herdr"
path = "src/bin/herdr.rs"

[[bin]]
name = "slopdesk-swift-access"
path = "src/bin/swift_access.rs"

[[bin]]
name = "slopdesk-synclient"
path = "src/bin/synclient.rs"

[[bin]]
name = "slopdesk-release"
path = "src/bin/release.rs"

[[bin]]
name = "slopdesk-gate"
path = "src/bin/gate.rs"

[[bin]]
name = "slopdesk-ops"
path = "src/bin/ops.rs"

[[bin]]
name = "slopdesk-guigate"
path = "src/bin/guigate.rs"

[dependencies]
# The ONE path edge in this crate, and the reason it is worth the exception the header's "ships in
# nothing" framing implies: `restart-hostd` reads a document hostd WRITES, so the eight fields have
# to be one declaration. They used to be three — a Swift `Codable` struct, a hand-written reader
# here, and the field names spelled again in both. `slopdesk-hostlaunch` is that declaration, and
# taking it is what makes a renamed field a compile error instead of a restart that quietly stops
# working.
slopdesk-hostlaunch = { path = "../slopdesk-hostlaunch" }
# The access raiser is a line scanner over SwiftFormat-clean source, which is what makes a regex
# the right reader rather than a shortcut — and the same DFA-backed crate the invariants gate
# takes, for the same reason: a pattern cannot blow up on input a foreign repo chose.
regex = "1"
# The differential forks two binaries per case and there are tens of thousands of cases. The work
# is entirely wait, and the cases are independent by construction.
rayon = "1"
# The tool stamps are a digest of each sidecar's source closure, and the release tarball's
# SHA256SUMS is what the Homebrew tap pins. RustCrypto's `sha2` rather than a hand-rolled block
# function or a `shasum` fork: it is the reference implementation the rest of the ecosystem audits,
# it is `no_std`-clean and dependency-light, and hashing in-process is what turns a stamp scan from
# hundreds of process spawns into one pass over the bytes.
sha2 = "0.11"
# Both engines answer in JSON and the diff is FIELD-level. Hand-rolling a reader for a document
# upstream controls is the classic place to be wrong, and the projection has to compare values
# structurally — `"1.0"` and `1.0` are not the same answer.
serde_json = "1"
# The GUI gates decode three control-socket verbs whose field names are the WIRE's, not Rust's, so
# the renames belong on the struct rather than in a hand-written reader — a key that changes on
# either side then fails to decode instead of silently reading zero.
serde = { version = "1", features = ["derive"] }
# `getsid`, `kill(pid, None)` and the signal constants. The pty-versus-helper census turns on
# `getsid(pid) == pid` and nothing else answers it: `ps -o sess=` returns 0 for every process on
# this machine. All three are SAFE in nix 0.31, so no gate needs `unsafe` to make the observation.
nix = { version = "0.31", features = ["process", "signal"] }

[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, the fused
#   multiply-add `CLAUDE.md` forbids. The synclient's `x1 + (x2 - x1) * t` is a coordinate that
#   crosses the wire, so rounding it once instead of twice changes bytes the host receives.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"

[profile.release]
opt-level = 3
