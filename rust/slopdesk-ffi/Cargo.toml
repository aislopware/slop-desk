# `slopdesk-ffi` — the C ABI the Swift clients call, and the SECOND of the two crates in this
# repository allowed to write `unsafe`.
#
# ## Why a second isolated crate rather than putting this in `slopdesk-posix`
# The two carry different obligations and mixing them would blunt both. `slopdesk-posix` argues
# about syscalls: what the kernel just did, what a descriptor's ownership is. This crate argues
# about ONE thing and always the same thing — a pointer and a length handed over by Swift, and
# whether they describe memory that is live for the duration of the call. Keeping them apart means
# each crate's reviewer holds one question in mind, not two.
#
# It also keeps the dependency shape honest: `slopdesk-posix` is linked by a daemon and must stay
# tiny; this crate is linked by the iOS app and pulls in the whole domain.
#
# ## What may live here
# A thin translation of a Rust function into the calling convention below, and NOTHING else. No
# logic — if a decision is being made in this crate, it belongs in the crate being wrapped, where
# `forbid(unsafe_code)` still applies to it. Every function here should read as one line of
# argument marshalling around one call.
#
# ## The calling convention, which is the whole safety story
# Every entry point takes zero or more `(const uint8_t *, size_t)` input pairs and one
# `(uint8_t *out, size_t cap)` output pair, and returns the number of bytes the answer NEEDS.
#
#   - Return 0                → there is no answer (the Rust `Option::None`).
#   - Return n, n <= cap      → `out[0..n]` is the answer.
#   - Return n, n >  cap      → nothing was written; call again with a buffer of at least n.
#
# **No ownership ever crosses the boundary**, so there is no free function to forget to call, no
# allocator mismatch, and no way for a leak to be a Swift-side bug. The cost is that an undersized
# buffer computes the answer twice, which is the correct trade for functions that are pure: the
# second call cannot disagree with the first.
[workspace]
resolver = "3"

[package]
name = "slopdesk-ffi"
version = "0.1.0"
edition = "2024"
publish = false
description = "The C ABI slopdesk's Swift clients call into — argument marshalling only, no logic"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_ffi"
# `staticlib` for the xcframework the apps link; `rlib` so this crate's own tests can call its
# entry points the way Swift does, rather than testing a different build of the same file.
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
slopdesk-agent = { path = "../slopdesk-agent" }
slopdesk-androidd = { path = "../slopdesk-androidd" }
slopdesk-cli = { path = "../slopdesk-cli" }
slopdesk-devicelog = { path = "../slopdesk-devicelog" }
slopdesk-devicepanel = { path = "../slopdesk-devicepanel" }
slopdesk-dropd = { path = "../slopdesk-dropd" }
slopdesk-fuzzy = { path = "../slopdesk-fuzzy" }
slopdesk-rowscan = { path = "../slopdesk-rowscan" }
slopdesk-hookevent = { path = "../slopdesk-hookevent" }
slopdesk-inspectord = { path = "../slopdesk-inspectord" }
# The metadata RPC's Rust half, taken here for ONE module: `path_confine`, the rule that decides
# whether a client-named path is inside the pane's project root. hostd asks it through this crate's
# door and the forked `slopdesk-probe` asks it directly, which is what makes the two layers of that
# confinement one rule rather than two that merely looked alike. The edge is also what puts the rule
# inside `build-ffi.sh`'s content stamp (`docs/55` §3); everything else in the crate is
# filesystem-walking that no client links and `-dead_strip` removes.
slopdesk-probe = { path = "../slopdesk-probe" }
slopdesk-sanitize = { path = "../slopdesk-sanitize" }
slopdesk-screenwire = { path = "../slopdesk-screenwire" }
slopdesk-sidecars = { path = "../slopdesk-sidecars" }
slopdesk-superwire = { path = "../slopdesk-superwire" }
slopdesk-terminal = { path = "../slopdesk-terminal" }
slopdesk-video = { path = "../slopdesk-video" }
slopdesk-altscreen = { path = "../slopdesk-altscreen" }
slopdesk-wire = { path = "../slopdesk-wire" }
slopdesk-workspace = { path = "../slopdesk-workspace" }
# The three crates carved out of `slopdesk-workspace`. The shim names modules in all four directly,
# so all four are direct edges — and each one is what puts that crate inside `build-ffi.sh`'s
# `INPUT_CRATES` closure (`docs/55` §3). A crate reached only through a re-export would be invisible
# to the stamp.
slopdesk-ids = { path = "../slopdesk-ids" }
slopdesk-settings = { path = "../slopdesk-settings" }
slopdesk-tree = { path = "../slopdesk-tree" }

# hostd's door only, and the ONE dependency in this graph that compiles a C library. `libgit2` is
# vendored inside `slopdesk-git`, and a client never asks the question — the git status arrives as a
# metadata reply on both platforms. Gated by target rather than by feature so no phone build can opt
# in by accident: `slopdesk_ffi.h` guards the declaration with `TARGET_OS_OSX`, and
# `scripts/build-ffi.sh` requires the symbol on the macOS slice and requires it ABSENT on the other
# two, so this cfg cannot quietly stop matching the header.
[target.'cfg(target_os = "macos")'.dependencies]
slopdesk-git = { path = "../slopdesk-git" }
# The injection doors' other half, and the FIRST `slopdesk-apple-*` crate — CoreGraphics event
# synthesis, called through `objc2`. Gated exactly as `slopdesk-git` is, and for a stronger reason:
# there is no CoreGraphics event injection on iOS at all, so an ungated edge would not merely cost
# bytes, it would fail to link. `docs/57-apple-frameworks-in-rust.md` §3 names this bijection as the
# only route a macOS-only crate may take into this graph.
slopdesk-apple-cgevent = { path = "../slopdesk-apple-cgevent" }
slopdesk-apple-cgdisplay = { path = "../slopdesk-apple-cgdisplay" }
slopdesk-apple-cgwindow = { path = "../slopdesk-apple-cgwindow" }

# Linked into an app, and one of the two consumers is the terminal's hot output path. `panic` is
# `abort` on purpose and it is not a size choice: unwinding across a C ABI frame into Swift is
# undefined, so a panic that escapes an entry point must end the process rather than corrupt it.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"

# ---------------------------------------------------------------------------- #
# The strict block, as everywhere else. `unsafe_code` is `deny` for the same reason it is in
# `slopdesk-posix`: every site carries its own self-expiring `#[expect]`, so an exemption that
# stops being needed fails the build.
[lints.rust]
unsafe_code = "deny"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

multiple_crate_versions = "allow"
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
