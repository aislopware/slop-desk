# `slopdesk-fuzzy` — fzf's `FuzzyMatchV2` ranking, the engine behind every search field in the app.
#
# ## Why it is a crate of its own
# Four surfaces rank against a typed query — the command palette, Open-Quickly, the command
# navigator and Jump-To — and every one of them wants the SAME order, because the order is muscle
# memory: `gc` must put `getConfig` above `gymnastic`, and a naive prefix/contains ladder ties them.
# The algorithm that gets that right is fzf's, and it is small, hot (per keystroke, over every
# candidate) and carries no domain at all: two strings in, a score and the matched positions out.
#
# It is not a module of a bigger crate because none of the bigger crates would be the right home:
# it is not the protocol, not the workspace document, not the terminal. It is a scorer. A crate is
# the smallest thing that can hold it without lending it a subject it does not have.
#
# ## Why vendor rather than depend
# `nucleo-matcher` and `fuzzy-matcher` are both healthy and both fzf-DERIVED — neither is fzf. They
# score differently, and the order is the product: swapping one in would silently re-rank every
# palette in the app. What is pinned here is fzf's own `algo.go`, verified against the real `fzf`
# binary by `slopdesk-fuzzybench`, so the wheel being reused IS the upstream one.
#
# PORTED FROM: junegunn/fzf, `src/algo/algo.go` — `FuzzyMatchV2` (the default "v2" matcher), MIT
# License, Copyright (c) 2013-2024 Junegunn Choi.
[workspace]
resolver = "3"

[package]
name = "slopdesk-fuzzy"
version = "0.1.0"
edition = "2024"
publish = false
description = "fzf's FuzzyMatchV2 ranking — score and matched positions for a query over a candidate"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_fuzzy"
path = "src/lib.rs"

# Runs per keystroke over every candidate in a list, inside the app.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"

# ---------------------------------------------------------------------------- #
# The same maximal-strict set every other crate carries, copied rather than inherited for the same
# reason they copy it: inheriting means membership, and membership means sharing a profile.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
