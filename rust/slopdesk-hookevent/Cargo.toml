# `slopdesk-hookevent` — what one Claude Code hook body SAYS, in the detection vocabulary.
#
# ## Why this is not `slopdesk-hook`
# That crate is the RELAY: the binary Claude Code forks twice per tool call to move a body from the
# agent's stdin to hostd's socket. Its cost is process startup, so nothing may be linked into it
# that it does not need — the rule its own manifest states. This crate is what the RECEIVER does
# with the body afterwards, in a process that is already running.
#
# ## Why this is not `slopdesk-agent`
# That crate takes zero dependencies on purpose, because every input it folds is untrusted and a
# dependency would be a hole in `forbid(unsafe_code)` + the panic denials. Reading arbitrary JSON is
# exactly where a hand-rolled parser is worst — escapes, surrogate pairs, number grammar, depth —
# so this crate uses `serde_json` and stays on the other side of that line. `slopdesk-agent` folds
# the RESULT; it never sees a byte of JSON.
#
# ## What it answers
# One hook body in, one `HookEvent` out — the SAME vocabulary `slopdesk_agent::ClaudeHookEvent`
# speaks, flattened to discriminants and four optional strings so it crosses the FFI as one blob.
# The mapping (which hook becomes which event, which one is a block, what its label reads) IS this
# crate: it was two Swift files, a typed payload enum and a `mapToHookEvent` adapter beside it, and
# splitting an event's identity from its meaning is what let the two drift.
#
# ## Why its own workspace
# The same reason `slopdesk-agent` and `slopdesk-fuzzy` are: cargo profiles are workspace-global,
# and the root workspace's is tuned for the hook binary (`opt-level = "z"`, `panic = "abort"`).

[workspace]
resolver = "3"

[package]
name = "slopdesk-hookevent"
version = "0.1.0"
edition = "2024"
publish = false
description = "Parses a Claude Code hook body into the slopdesk detection vocabulary"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_hookevent"
path = "src/lib.rs"

[dependencies]
# The body is written by whatever the agent's hook configuration forked — a nested `claude -p`, a
# foreign producer, a truncated write. A tolerant, well-tested reader is the point of the dependency.
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The same maximal-strict block as `rust/slopdesk-agent/Cargo.toml`, copied rather than inherited
# for the reason stated there: inheriting means being a workspace member, which the profile forbids.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
