# `slopdesk-hostnet` — hostd's PATH-1 socket, without Network.framework.
#
# ## Why it exists
# `docs/60-hostd-in-rust.md` stage A. The host end of the terminal transport was four Swift files
# built on `NWListener`/`NWConnection`, and `docs/59` §6 called them the floor "for as long as hostd
# is a Swift process". Read for what they ASK FOR rather than what they are written in, they are
# plain TCP: `noDelay`, keepalive 10/5/3, and `NWParameters(tls: nil, tcp:)` — no TLS, no QUIC, no
# Bonjour, no multipath, peer-to-peer off. Every one of those is `std::net` plus three sockopts, so
# the floor is a framework nobody needed rather than a framework nobody can replace.
#
# ## What is here and what is not
# HERE: the association preamble, the TCP parameters, the accept loop, and the map of half-paired
# links — the part that owns live file descriptors.
# NOT here, and deliberately: the pairing RULE. `slopdesk-muxsession::pairing` already decides what
# an arriving half means and whether a parked one has expired, with its whole state space written
# out as a test table (`docs/59` step 6). This crate applies that verdict to real sockets and closes
# what it is told to close; it does not re-derive it. Also not here: anything that reads a mux
# FRAME — the decoder, the channel table, admission and flow control are `slopdesk-wire::mux`'s.
# This crate hands up a pair of byte links and has no opinion about what rides them.
#
# ## Three dependencies, and the rule about which
# `socket2` is rust-lang's own crate and it is here for exactly one reason: `TcpKeepalive` spells
# `with_time`/`with_interval`/`with_retries`, which are the three values `TransportParameters.swift`
# set and which `std::net` does not expose. The alternative is three `setsockopt` calls, and a
# `setsockopt` with no safe wrapper is `slopdesk-posix`'s business by `CLAUDE.md`'s rule — so the
# choice is between a maintained wrapper and growing the `unsafe` crate for a socket option. The
# wrapper wins; `forbid(unsafe_code)` below is the proof it was not needed here.
#
# `slopdesk-wire` is here for ONE constant: `SESSION_ID_BYTE_COUNT`. The preamble this crate frames
# and the `hello` body that crate decodes are the same 16-byte field, and `ChannelAssociation.swift`
# already refused to transcribe it — it asks `slopdesk_wire_constant(1)`. Asking is carried across.
#
# `slopdesk-muxsession` is here for `pairing::{decide, pending_expired}`, for the reason above: the
# rule exists, it is tested exhaustively, and a second reading of "is this half displacing another"
# is precisely the one that leaks an fd.
[package]
name = "slopdesk-hostnet"
version = "0.1.0"
edition = "2024"
publish = false
description = "hostd's PATH-1 TCP listener, preamble and CONTROL/DATA pairing for slopdesk"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[workspace]

[dependencies]
socket2 = { version = "0.5", features = ["all"] }
slopdesk-wire = { path = "../slopdesk-wire" }
slopdesk-muxsession = { path = "../slopdesk-muxsession" }

# A daemon's profile: hostd is long-lived and this crate sits on the per-chunk receive path.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block, copied rather than inherited — inheriting would mean being a workspace member,
# which is what the profile forbids.
[lints.rust]
# `forbid`, not `deny`: the whole argument for this crate is that hostd's socket needs no `unsafe`.
# `socket2` carries the sockopts and `std` carries the rest, so there is nothing left to hand-write;
# `forbid` turns that from a fact about today's code into one no downstream `allow` can undo.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids. Allowed in every workspace for that repo-wide reason,
#   not because this crate does float math — it does none.
suboptimal_flops = "allow"
imprecise_flops = "allow"
