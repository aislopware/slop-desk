# `slopdesk-hostserver` — hostd's composition root, in Rust.
#
# ## Why it is a crate of its own
# `docs/60` stage D's finding is that this stage has NO engine left to write: every decision the
# Swift under it reaches for is already Rust somewhere. What is left is composition — which pane a
# channel names, which parked pane a returning client may take, which service is up, which verb goes
# where — and composition is exactly the thing that cannot live in any of the crates it composes.
# `slopdesk-muxsession` is verdicts with no IO; `slopdesk-hostsession` is ONE pane and knows nothing
# about the table it sits in; `slopdesk-hostnet` decides nothing about panes at all. This crate is
# the one that may hold all of them, so it is the one place the joins can live.
#
# ## Its own `[workspace]`, for the reason its three siblings have one
# `rust/Cargo.toml`'s members are the FORK-PER-EVENT programs and nothing else, and they share a
# startup-tuned `opt-level = "z"`. A daemon's half wants a daemon's profile. The cost is the one
# every host crate already pays: `cargo -p` from the root cannot reach it, its gate is
# `cd rust/slopdesk-hostserver && cargo test` behind `make hostserver-test`, and `make lint-reach` is
# what proves some target still runs it.

[workspace]
resolver = "3"

[package]
name = "slopdesk-hostserver"
version = "0.1.0"
edition = "2024"
publish = false
description = "hostd's composition: the session table, the detached store, and the services around them"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_hostserver"
path = "src/lib.rs"

[dependencies]
# Every relation the table keeps — channel→pane, pane→session, session→hook sink, path→document id —
# and the two detach-retention rules the store reads. `Registry` is the table; this crate is the
# retention around it, which is the half a `u64` cannot carry.
slopdesk-muxsession = { path = "../slopdesk-muxsession" }

# The pane the table holds, behind [`crate::pane::Pane`] rather than by name: `slopdesk-hostsession`
# is what a REAL hostd puts in the table, and the trait is what lets this crate's suite drive the
# retention without a PTY, a superd and six threads per entry.
slopdesk-hostsession = { path = "../slopdesk-hostsession" }

# The transport a channel arrives on: the open event, the two sub-channels it carries, and the ack
# that answers it. Reached DIRECTLY rather than through `slopdesk-hostsession` since D.6.2 — the open
# ladder names the sub-channel pair before any pane holds it, which is the whole window the join
# reservation and the claim exist to make indivisible. Nothing here decides anything about panes.
slopdesk-hostnet = { path = "../slopdesk-hostnet" }

# Every DECISION the two service lifecycles reach for — the announce parse, the probe step, the
# adopt verdict, the workbench's four boot gates, the CLI flags — plus the line assembler a panel
# backend's PTY output is cut into lines with. None of it was written for this crate; all of it was
# already behind `HostServiceRules` before the port started.
slopdesk-sidecars = { path = "../slopdesk-sidecars" }

# superd is what forks a panel backend and what keeps it across a hostd rebuild, so the service
# handle is a client of this rather than a `Command`.
slopdesk-superclient = { path = "../slopdesk-superclient" }

# The subscription a service's log lines arrive on, and the `resumed_lossily` answer that decides
# whether a survivor may be adopted at all.
slopdesk-hostpane = { path = "../slopdesk-hostpane" }

# The spawn request that crosses to superd, and the two event batches a pane sink is handed — always
# empty for a service, which is a fact about the spawn rather than about the sink.
slopdesk-superwire = { path = "../slopdesk-superwire" }

# One type, and it is the client's: the editor font spec verb 20 carries into the workbench's
# settings file.
slopdesk-wire = { path = "../slopdesk-wire" }

# One function, and it is the link detector's: the `:line:col` tail an open target may carry. The
# bridge splits it with the SAME splitter the client's terminal uses, so a detected link and a
# bridge open can never disagree about where the path ends.
slopdesk-terminal = { path = "../slopdesk-terminal" }

# Four of the ten metadata verbs, and the confinement in front of three of them: `path_confine` is
# what keeps a listing inside its pane's subtree, and `files`/`git` are the bodies `HostProbe.swift`
# forks a process to reach. This side CALLS them, at the same level `slopdesk-probe`'s `main.rs`
# dispatches to — one function lower would drop `read_session`'s second confinement silently.
slopdesk-probe = { path = "../slopdesk-probe" }

# The `processes` and `ports` verbs: the descendant walk off one shell pid, and the listening sockets
# those descendants hold. Neither is a decision this crate makes; both are a census it asks for.
slopdesk-panecensus = { path = "../slopdesk-panecensus" }

# The `git status` verb's porcelain read. `git diff` is `slopdesk-probe`'s, because the diff a pane
# asks for is confined against the pane's cwd first and the status is not.
slopdesk-git = { path = "../slopdesk-git" }

# The sensitive-name set the mutating-verb gate consults, the canonical name it consults it with,
# and the supervision vocabulary `report` validates against. All three were already the detector's;
# none of them is a decision this crate makes.
slopdesk-agent = { path = "../slopdesk-agent" }

# The `wait --until` scan, one PTY chunk at a time. The bounds it carries — a raw carry for a split
# escape, a fixed overlap window, a linear match — are the reason the scan may run on the read-loop
# thread at all, and they were written for that thread.
slopdesk-rowscan = { path = "../slopdesk-rowscan" }

# The ANSI pass every text-shaped answer runs, and the prompt-EOL pass a block's output runs first.
slopdesk-sanitize = { path = "../slopdesk-sanitize" }

# The `screen` verb's ONE round trip: screend parses the pane's replay into a fresh grid and
# answers what it shows. Reached from `live.rs` rather than from the dispatcher, so the verb stays
# drivable by a fake — the departure `ControlPane::render_screen` documents.
slopdesk-screenclient = { path = "../slopdesk-screenclient" }

# The grid `screen` answers with — screend renders it, this is the payload shape. The round trip
# itself is behind `ControlPane::render_screen`, so this crate names the type and not the socket.
slopdesk-screenwire = { path = "../slopdesk-screenwire" }

# The per-line cap the ctl socket refuses past, and the trimmed span it refuses on. Read from the
# rules rather than typed: the CLIENT's control socket keeps the same cap and reads the same number,
# so the two ends of one socket cannot disagree about which line was too long. Also the tmux key
# vocabulary `write --keys` translates through.
slopdesk-workspace = { path = "../slopdesk-workspace" }

# The two socket options macOS has and `nix` does not wrap for a bare descriptor — close-on-exec on
# everything the bridge accepts, and `SO_NOSIGPIPE`, without which one write to a workbench window
# that has just closed ends the whole host.
slopdesk-posix = { path = "../slopdesk-posix" }

# The one notation this crate cannot spell for itself: sixteen bytes as canonical UUID text, and
# back. Every ctl verb names a pane by that text and the tables name it by the bytes.
slopdesk-ids = { path = "../slopdesk-ids" }

# `poll` for the accept loop's two-descriptor park and `pipe` for the byte that ends it — the shape
# `slopdesk-superd`'s pump loop uses, and the reason no descriptor is ever closed out from under a
# syscall here. `hostname` is `host info`'s one field the environment cannot answer: a feature of its
# own in `nix`, so the verb needs it named here rather than a bare `gethostname` call.
nix = { version = "0.31", features = ["fs", "hostname", "poll", "socket"] }

# The Finder and Launch Services half of the two side-effecting PATH verbs. Not target-gated: the
# crate carries its own non-macOS shapes, so `crate::pathaction::Finder` compiles everywhere and
# simply declines where there is no Launch Services to ask.
slopdesk-apple-app = { path = "../slopdesk-apple-app" }

# The agent-control protocol IS JSON — one object per line, in and out. `serde_json`'s default map
# is a `BTreeMap`, so its keys come out sorted: byte for byte what `JSONSerialization`'s
# `sortedKeys` produced, which is what makes a Rust-served line and a Swift-served one the same line
# for as long as both exist. A `[dependencies]` entry rather than a dev one since D.5: the ctl socket
# encodes every answer with it, and `tests/serviceproc.rs`'s fake superd — which was what first
# needed it, to build the replies superd would send — reads it from here now.
serde_json = "1"

# The macOS pasteboard behind `crate::clipsync::GeneralBoard`. TARGET-GATED, unlike the crate above,
# because `NSPasteboard` has no cross-platform twin and the crate offers no stub: the FOLD in
# `clipsync` builds everywhere and is tested against a fake, and only the door is macOS-only.
[target.'cfg(target_os = "macos")'.dependencies]
slopdesk-apple-pasteboard = { path = "../slopdesk-apple-pasteboard" }

# The FSEvents stream behind `crate::repowatch::FsEvents`. Target-gated for the same reason as the
# pasteboard: the crate wraps a macOS framework and offers no non-macOS shape, because a watcher with
# nothing to watch is not a fallback, it is a lie the fold would then have to carry.
slopdesk-apple-fsevents = { path = "../slopdesk-apple-fsevents" }

# The delivery queue `FSEventStreamSetDispatchQueue` takes, and the only reason this crate names
# `dispatch2` at all: the framework hands its callbacks to a `dispatch_queue_t` and nothing else, so
# the queue is hostd's to own rather than the wrapper's.
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }

# In hostd, on the accept path and under the server's one lock.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The maximal-strict set every sibling carries, copied rather than inherited for the same reason
# they copy it: inheriting means membership, and membership means sharing a profile.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason: both want `f64::mul_add`, the fused multiply-add `CLAUDE.md` forbids —
# FMA rounds once where the wire rounds twice, which moves the bit patterns the golden vectors pin.
suboptimal_flops = "allow"
imprecise_flops = "allow"

# One version of `nix` reaches this graph through `slopdesk-hostsession` and one through
# `slopdesk-posix` beneath it; they are the same version, and the lint prices the transitive graph
# rather than this manifest.
multiple_crate_versions = "allow"

[dev-dependencies]
# The tree a topology is built OVER, for the two intent tests that need a real workspace to
# change. Not a runtime dependency: this crate reads a topology out of the document and writes one
# back, and never constructs the tree by hand.
slopdesk-tree = { path = "../slopdesk-tree" }
