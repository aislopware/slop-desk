# `slopdesk-instruments` — the command-line instruments, in the language the code they measure is in.
#
# ## Why they moved
# Every program here was a `Sources/slopdesk-*/main.swift`, and a `main.swift` is by definition not
# UI — the one thing `CLAUDE.md` keeps in Swift. What each one measures had already moved: the
# reattach composer is `slopdesk-screend` behind a 47-line Swift face, the swipe-nav push is
# `slopdesk_video::{video_control, cursor, swipe_nav}` behind another, and the palette's ranking is
# `slopdesk-fuzzy`. An instrument written on the far side of a marshalling face measures the face;
# written here it measures the thing.
#
# ## Why one crate with four bins and not four crates
# `slopdesk-devtools`'s argument, unchanged: these have nothing in common at the domain level — one
# times a UNIX-socket round trip, one speaks UDP to a live daemon, one spawns `fzf`, one drives
# `ScreenCaptureKit` — but they share the only property that decides where code lives, which is that
# they are short-lived operator tools shipping in nothing. None is a gate (`slopdesk-invariants` is
# where a gate goes), none is linked into the app, none is `execve`d by a daemon. Four workspaces
# would quadruple the `cargo fmt` and clippy passes `just lint` walks to buy a boundary nobody
# crosses.
#
# `slopdesk-framewatch` is the one whose dependencies are not free — it links three
# `slopdesk-apple-*` crates — and it is here anyway, because that family is exactly what it is FOR:
# the Swift original hand-rolled its own `SCStreamConfiguration` and its own `CVPixelBuffer` walk,
# so it measured a second spelling of the host's capture rather than the host's capture. Asking
# `slopdesk-apple-sck` the way `slopdesk-videohostd` asks it is the whole point of the port, and the
# `objc2` tree it pulls in is compiled once per `just lint` either way.
#
# `slopdesk-fuzzybench` is a bin HERE rather than an example in `slopdesk-fuzzy` for one mechanical
# reason: `examples/` is auto-discovered, so it would silently join that crate's own build and lint
# surface — a harness that spawns a foreign binary has no business inside the crate under test.
#
# `slopdesk-navhistory-probe` is NOT here, and that is the same rule applied honestly: it needs
# `slopdesk-ffi`, whose dependency tree is the whole app. Paying that to time a socket round trip is
# exactly the cost this file's `[workspace]` exists to refuse, so it has its own crate next door.
#
# ## Its own workspace, for the usual reason
# Profiles are workspace-global. `rust/Cargo.toml` is `opt-level = "z"` because its members are
# forked per event and startup time is their whole cost; a throughput bench under that profile
# reports a number nothing in production would ever see.
[workspace]
resolver = "3"

[package]
name = "slopdesk-instruments"
version = "0.1.0"
edition = "2024"
publish = false
description = "The slopdesk command-line instruments — the reattach-compose bench, the swipe-nav status probe, the fuzzy-ranking parity bench and the frame-cadence watcher"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-replay-bench"
path = "src/bin/replay_bench.rs"

[[bin]]
name = "slopdesk-swipestatus-probe"
path = "src/bin/swipestatus_probe.rs"

[[bin]]
name = "slopdesk-fuzzybench"
path = "src/bin/fuzzybench.rs"

[[bin]]
name = "slopdesk-framewatch"
path = "src/bin/framewatch.rs"

[dependencies]
# The screend wire, including where the socket is. The bench must dial it the way hostd does or it
# is timing a different link.
slopdesk-screenwire = { path = "../slopdesk-screenwire" }
# The PATH-2 wire: the mux prefix, the control messages and the cursor channel the probe reads.
slopdesk-video = { path = "../slopdesk-video" }
# The scorer under test, held DIRECTLY. `slopdesk-fuzzy` is zero-dependency, so it costs this
# workspace nothing but itself — and measuring it through the FFI door instead would report the
# marshalling, which `docs/55` already timed.
slopdesk-fuzzy = { path = "../slopdesk-fuzzy" }

# `slopdesk-framewatch`'s three, target-gated because every one of them compiles to nothing off
# macOS and the other three bins must keep building where there is no window server.
[target.'cfg(target_os = "macos")'.dependencies]
# The capture stream itself — the SAME door `slopdesk-videohostd` opens, which is the whole reason
# the port happened: an instrument that built its own `SCStreamConfiguration` measured a second
# spelling of the host's, and a divergence between the two read as a cadence result. `docs/57` §3.5
# names this crate as framewatch's.
slopdesk-apple-sck = { path = "../slopdesk-apple-sck" }
# The luma plane as a `&[u8]`. This workspace is `forbid(unsafe_code)`, and
# `PixelBuffer::lock_read_only().plane_view(0)` — the sample-memory obligation carried where
# `docs/57` §2 says it belongs — is what lets it walk pixels anyway.
slopdesk-apple-vt = { path = "../slopdesk-apple-vt" }
# `SCStream::startCapture` aborts with `CGS_REQUIRE_INIT` without a window-server connection, and
# ScreenCaptureKit delivers several completions through the MAIN run loop. `become_accessory` is the
# first, `drain_main_queue` is the second — together they are the Swift original's
# `_ = NSApplication.shared` and its `RunLoop.main.run()`.
slopdesk-apple-nsapp = { path = "../slopdesk-apple-nsapp" }

[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate". A throughput number folded
#   with one rounding instead of two is not the number the Swift instrument printed, and the whole
#   point of a bench is that today's number is comparable with the one in `docs/DECISIONS.md`.
# - `multiple_crate_versions` (cargo): both dependencies are path crates with no registry tree
#   between them, so this can only ever fire on a toolchain artefact outside our control.
# A bench reports throughput and a probe waits on a live daemon. Neither is startup-bound, and the
# bench's number is only meaningful at the optimisation level the daemon it dials ships with.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
