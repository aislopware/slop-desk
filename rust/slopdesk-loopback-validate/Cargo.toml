# `slopdesk-loopback-validate` — the headless closed-loop validation harness.
#
# ## Why it is its OWN workspace and not a bin in `slopdesk-ffi`
# `slopdesk-gate ffi` stamps the linked artifact against the source closure it walks from the shim
# down its `path = "../…"` edges. A bin inside that workspace would put every harness tweak inside
# that closure, so tuning a scenario would re-stale the `.xcframework` and re-run `just ffi` for a
# change no Swift file can see. The edge only points one way here: this crate depends on the shim,
# the shim knows nothing about it.
#
# ## Why it may not write `unsafe`
# `CLAUDE.md` names the three crates that may, and this is not one of them. It does not need to be:
# the encoder and the decoder both carry a Rust-native sink alongside their C door, and
# `slopdesk-apple-vt`'s `PixelBuffer` brackets its own lock — so the whole harness is safe Rust
# calling safe Rust, and the `unsafe` it would otherwise have hand-written stays where it is owned.
[workspace]
resolver = "3"

[package]
name = "slopdesk-loopback-validate"
version = "0.1.0"
edition = "2024"
publish = false
description = "Headless closed-loop validation of the real video software loop: HW encode, wire, FEC, HW decode, and every controller"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-loopback-validate"
path = "src/main.rs"

[dependencies]
# The whole loop under test: the packetizer, the reassembler, FEC, every controller, and the
# harness's own deterministic content and loss primitives in `loopback`.
slopdesk-video = { path = "../slopdesk-video" }
# The DECODER join, reached through its Rust-native sink rather than its C door. The client half of
# the wire is still Swift's caller, so that door is live and the shim is still its home.
slopdesk-ffi = { path = "../slopdesk-ffi" }
# The ENCODER join. It moved out of the shim when the Swift host was deleted (`docs/61` §2), and the
# harness followed it rather than keeping a copy: the whole claim this crate makes is that it
# measures the object the host actually drives, and a second encoder shaped like it would answer a
# different question. The daemon's own workspace and profile come with it, which is the cost of that
# claim and is the right one to pay.
slopdesk-videohostd = { path = "../slopdesk-videohostd" }
# `PixelBuffer` — the synthetic frame source, and the read-back the picture check measures.
slopdesk-apple-vt = { path = "../slopdesk-apple-vt" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Disabled, with reasons:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, the fused
#   multiply-add `CLAUDE.md` forbids. This harness folds the SAME estimates the host does, and a
#   fold rounded once instead of twice is a different number than the one shipping.
suboptimal_flops = "allow"
imprecise_flops = "allow"
# - `multiple_crate_versions` (cargo): the duplicates are deep inside `slopdesk-ffi`'s own tree —
#   `syn`, `thiserror`, `jni-sys` — and nothing this crate can choose changes them.
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
