# `slopdesk-muxnet` — the mux over two sockets, with no end of it in the name.
#
# ## Why it exists
# `docs/63-client-transport-in-rust.md` stage G.1. Everything here was `slopdesk-hostnet`'s until the
# client's transport started crossing to Rust, and the split is the answer to one question: which of
# those files says HOST anywhere. The answer is two of seven — the accept loop and the map of
# half-paired links — and the other five say only "two sockets carrying a mux". A preamble is the
# same 17 bytes whichever end writes it, `noDelay` and the keepalive ladder are a bound both ends
# must agree on, a byte link is a byte link, a sub-channel's credit window is symmetric by
# construction, and the connection asks `slopdesk-wire`'s admission ladder which role it is rather
# than assuming. So the five move here and the two stay, and the phone links an accept loop it could
# never call only if this crate does not exist.
#
# ## What is here and what is not
# HERE: the association preamble, the TCP parameters, one byte link, one sub-channel, and the two
# threads that read mux frames off a paired connection and demultiplex them into per-channel
# streams. Everything in that list owns a file descriptor or a thread.
# NOT here: every RULE any of it applies. `slopdesk-wire::mux` decides whether a frame is admitted,
# where it routes, what a channel's ending reaches, and every flow-control number — including which
# of those answers differ by role. This crate applies those verdicts to real sockets and closes what
# it is told to close; it re-derives none of them, and it re-derives the ROLE asymmetry least of all.
# Also not here, and this is the split's own boundary: nothing about ACCEPTING (`slopdesk-hostnet`)
# and nothing about DIALLING (`slopdesk-clientnet`). A `PairedConnection` arrives from one of those
# two; how it was obtained is not this crate's business, which is exactly why both can exist.
#
# ## Two dependencies, and the rule about which
# `socket2` is rust-lang's own crate and it is here for exactly one reason: `TcpKeepalive` spells
# `with_time`/`with_interval`/`with_retries`, which are the three values `TransportParameters.swift`
# set and which `std::net` does not expose. The alternative is three `setsockopt` calls, and a
# `setsockopt` with no safe wrapper is `slopdesk-posix`'s business by `CLAUDE.md`'s rule — so the
# choice is between a maintained wrapper and growing the `unsafe` crate for a socket option. The
# wrapper wins; `forbid(unsafe_code)` below is the proof it was not needed here.
#
# `slopdesk-wire` carries the frames, the channel tables, the flow-control numbers, the admission
# ladder and `SESSION_ID_BYTE_COUNT`. The preamble this crate frames and the `hello` body that crate
# decodes are the same 16-byte field, and `ChannelAssociation.swift` already refused to transcribe
# it — it asks `slopdesk_wire_constant(1)`. Asking is carried across.
[package]
name = "slopdesk-muxnet"
version = "0.1.0"
edition = "2024"
publish = false
description = "the role-generic half of slopdesk's PATH-1 mux: preamble, links, sub-channels, connection"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[workspace]

[dependencies]
socket2 = { version = "0.6", features = ["all"] }
slopdesk-wire = { path = "../slopdesk-wire" }

# A daemon's profile: this crate sits on the per-chunk receive path at both ends.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The strict block, copied rather than inherited — inheriting would mean being a workspace member,
# which is what the profile forbids.
[lints.rust]
# `forbid`, not `deny`: the whole argument for this crate is that a mux over two sockets needs no
# `unsafe`. `socket2` carries the sockopts and `std` carries the rest, so there is nothing left to
# hand-write; `forbid` turns that from a fact about today's code into one no downstream `allow` can
# undo — including the iOS client, which links this crate and is the reason it exists.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids. Allowed in every workspace for that repo-wide reason,
#   not because this crate does float math — it does none.
suboptimal_flops = "allow"
imprecise_flops = "allow"
