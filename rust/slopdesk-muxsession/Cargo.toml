# `slopdesk-muxsession` — the decisions inside one hostd pane session.
#
# ## Why it is a crate of its own
# `MuxChannelSession` is two things wearing one name: an IO shell (Tasks, a PTY descriptor, four
# relays, a teardown ladder) and a set of POLICIES the shell consults — who votes on the pane's
# grid, which fold that produces, when a change is worth settling for. The shell is Apple
# concurrency and syscalls; the policies are arithmetic over small integers, and arithmetic living
# inside an actor is arithmetic nothing can test without a PTY.
#
# It is not `slopdesk-wire`: that crate is the PROTOCOL, and none of this reads a frame. It is not
# `slopdesk-superwire` either, which is the superd socket's framing. What is here is what docs/45
# §8.3 *decides*, with the `TIOCSWINSZ` that carries the decision left where the descriptor is.
[workspace]
resolver = "3"

[package]
name = "slopdesk-muxsession"
version = "0.1.0"
edition = "2024"
publish = false
description = "The policy half of a hostd pane session: the PTY size fold over its contributors"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_muxsession"
path = "src/lib.rs"

[dependencies]
# The two rules `bridge_router` asks rather than restates. Both were written more than once before
# — containment in three languages, the shell word in eight places — so a fourth and a ninth copy
# here would be exactly the drift pair the one-implementation rule exists for. Both edges point
# DOWN and neither crate names this one back.
slopdesk-ids = { path = "../slopdesk-ids" }
slopdesk-probe = { path = "../slopdesk-probe" }

# In hostd, in the resize path of every attached client.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The maximal-strict set every sibling carries, copied rather than inherited for the same reason
# they copy it: inheriting means membership, and membership means sharing a profile.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason: both want `f64::mul_add`, the fused multiply-add `CLAUDE.md` forbids —
# FMA rounds once where the wire rounds twice, which moves the bit patterns the golden vectors pin.
suboptimal_flops = "allow"
imprecise_flops = "allow"
