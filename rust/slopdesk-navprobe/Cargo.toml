# `slopdesk-navprobe` — the swipe-nav history reader, exercised against a LIVE app.
#
# ## Why it is not a bin in `slopdesk-instruments`
# Because of what it costs. The other instruments dial a socket and need the wire crates; this one
# needs the JOIN — `slopdesk-videohostd`'s `navhistory`, where `slopdesk-apple-ax`'s element reads
# meet `slopdesk_video::nav_history`'s rules — and the daemon's dependency tree is every Apple
# framework the host touches. Putting a 90-line probe in the same crate as a socket bench would make
# the bench pay for the whole host.
#
# ## Why it is not a bin inside `slopdesk-videohostd` either
# `slopdesk-loopback-validate`'s argument, transposed: a bin in that crate would be built by every
# `cargo` invocation the daemon's own recipes make, so an argument rename here would rebuild the
# host. The edge points one way — this crate depends on the daemon, the daemon knows nothing about
# it — and that is also why the probe cannot drift from what ships: it drives the SAME reader the
# 4 Hz status beat drives, not a copy of it.
#
# ## Why it may not write `unsafe`
# `CLAUDE.md` names the three crates that may, and this is not one of them. It does not need to be:
# the reader is safe Rust over `slopdesk-apple-ax`, `slopdesk_apple_ax::is_trusted` is safe, and
# every pid read is `slopdesk-posix`'s — so the whole probe is safe Rust calling safe Rust, and the
# `unsafe` it would otherwise have hand-written stays where it is owned.
[workspace]
resolver = "3"

[package]
name = "slopdesk-navprobe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runtime proof that the swipe-nav history reader reads a live app's canGoBack/canGoForward"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-navhistory-probe"
path = "src/main.rs"

[dependencies]
# The join under test: the strategy selection, the walk bounds, the per-window currency rule and the
# cache — the daemon's own reader, linked rather than mirrored.
slopdesk-videohostd = { path = "../slopdesk-videohostd" }
# The Accessibility grant, asked the way every other caller asks it.
slopdesk-apple-ax = { path = "../slopdesk-apple-ax" }
# A pid's bundle identifier — the half of "which process is Chrome" that is AppKit's.
slopdesk-apple-app = { path = "../slopdesk-apple-app" }
# The other half: the all-pids census, which is one syscall and has exactly one home.
slopdesk-posix = { path = "../slopdesk-posix" }

[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, the fused
#   multiply-add `CLAUDE.md` forbids. This program's only arithmetic is a duration in milliseconds,
#   and the opt-out is here anyway so the standing rule holds by construction rather than by
#   absence.
# - `multiple_crate_versions` (cargo): the duplicates are deep inside the daemon's own tree and
#   nothing this crate can choose changes them.
# Every beat is blocking out-of-process IPC, so nothing here is CPU-bound. The profile matters only
# because the reader it links is the one the daemon ships.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"

[profile.release]
opt-level = 3
lto = "thin"
