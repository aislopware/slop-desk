# `slopdesk-navprobe` — the swipe-nav history reader, exercised against a LIVE app.
#
# ## Why it is not a bin in `slopdesk-instruments`
# Because of what it costs. The other instruments dial a socket and need the wire crates; this one
# needs the JOIN — `slopdesk-ffi`'s `nav_history`, where `slopdesk-apple-ax`'s element reads meet
# `slopdesk_video::nav_history`'s rules — and `slopdesk-ffi`'s dependency tree is the whole
# application. Putting a 90-line probe in the same crate as a socket bench would make the bench pay
# for the app.
#
# ## Why it is not a bin inside `slopdesk-ffi` either
# `slopdesk-loopback-validate`'s argument, unchanged: `slopdesk-gate ffi` stamps the linked artifact
# against the source closure it walks from the shim down its `path = "../…"` edges. A bin inside
# that workspace would put every probe tweak inside that closure, so an argument rename here would
# re-stale the `.xcframework` and re-run `just ffi` for a change no Swift file can see. The edge
# points one way: this crate depends on the shim, the shim knows nothing about it.
#
# ## Why it may not write `unsafe`
# `CLAUDE.md` names the three crates that may, and this is not one of them. It does not need to be:
# the reader carries a Rust-native face alongside its C door, `slopdesk_apple_ax::is_trusted` is
# safe, and every pid read is `slopdesk-posix`'s — so the whole probe is safe Rust calling safe
# Rust, and the `unsafe` it would otherwise have hand-written stays where it is owned.
[workspace]
resolver = "3"

[package]
name = "slopdesk-navprobe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runtime proof that the swipe-nav history reader reads a live app's canGoBack/canGoForward"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-navhistory-probe"
path = "src/main.rs"

[dependencies]
# The join under test: the strategy selection, the walk bounds, the per-window currency rule and the
# cache, reached through its Rust face rather than its C door.
slopdesk-ffi = { path = "../slopdesk-ffi" }
# The Accessibility grant, asked the way every other caller asks it.
slopdesk-apple-ax = { path = "../slopdesk-apple-ax" }
# A pid's bundle identifier — the half of "which process is Chrome" that is AppKit's.
slopdesk-apple-app = { path = "../slopdesk-apple-app" }
# The other half: the all-pids census, which is one syscall and has exactly one home.
slopdesk-posix = { path = "../slopdesk-posix" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Disabled, with reasons:
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, the fused
#   multiply-add `CLAUDE.md` forbids. This program's only arithmetic is a duration in milliseconds,
#   and the opt-out is here anyway so the standing rule holds by construction rather than by
#   absence.
suboptimal_flops = "allow"
imprecise_flops = "allow"
# - `multiple_crate_versions` (cargo): the duplicates are deep inside `slopdesk-ffi`'s own tree and
#   nothing this crate can choose changes them.
multiple_crate_versions = "allow"

# Every beat is blocking out-of-process IPC, so nothing here is CPU-bound. The profile matters only
# because the reader it links is the one the daemon ships.
[profile.release]
opt-level = 3
lto = "thin"
