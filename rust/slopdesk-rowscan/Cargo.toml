# `slopdesk-rowscan` — the scans over terminal ROWS that need a regex engine: Hint Mode's targets
# and find-in-terminal's matches. Rows in, `(row, column, length)` spans out.
#
# ## Why these two share a crate, and why it is not `slopdesk-terminal`
# Because of the one dependency both need. A `hint-pattern` and a Cmd-F regex are PATTERNS a human
# typed, run against rows a remote program wrote — the two places in the tree where untrusted input
# meets untrusted input. `regex` is the answer to exactly that pairing: a finite automaton with no
# backtracking, so a match costs time linear in the row no matter what the pattern says. The Swift
# both replaced used `NSRegularExpression`, which backtracks, so a pattern pasted off the internet
# could hang the overlay — or freeze the find bar on every keystroke — and no bound on the SCAN
# fixes a pathological MATCH.
#
# `slopdesk-terminal`'s manifest says it takes no external dependency because everything it parses
# is untrusted and it sits on the PTY hot path. The honest reading of that rule is not to smuggle a
# crate in beside the tracker, so the modules that need one live here and take the link scan as a
# sibling. That boundary is the whole reason this crate exists, and it is where a third module
# belongs if one ever needs a pattern engine over rows.
#
# ## Why its own workspace
# The same reason every library crate in this tree is: cargo profiles are workspace-global and the
# root workspace's is tuned for the hook binary (`opt-level = "z"`, `panic = "abort"`). A hint scan
# runs on the keystroke that opens the overlay and a find runs on every keystroke in the bar, so
# both want `opt-level = 3`; a panic in either must never abort a client.
#
# ## What is NOT here
# Anything a caller does with the spans. Assigning two-letter labels, walking next/previous with
# wrap, keeping a selection anchored across a recompute — list arithmetic over the answer, running
# per keystroke beside the surface that already holds it. Those stay in Swift.

[workspace]
resolver = "3"

[package]
name = "slopdesk-rowscan"
version = "0.1.0"
edition = "2024"
publish = false
description = "Regex-driven row scans for slopdesk — Hint Mode targets and find-in-terminal"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_rowscan"
path = "src/lib.rs"

[dependencies]
# The link scan, the display-cell widths and the per-row bound `hint` needs. Every column it reports
# has to line up with one the link overlay drew, so both read the same clustering — the alternative
# is a badge that sits half a glyph away from the span it labels on a CJK row.
slopdesk-terminal = { path = "../slopdesk-terminal" }

# The escape stripper and the held-back-tail rule `waituntil` feeds its chunks through. One grammar
# answers "where does this chunk stop being decidable" and "what did it say" — they used to be two
# machines, each documented as matching the other.
slopdesk-sanitize = { path = "../slopdesk-sanitize" }

# The pattern engine. Linear-time by construction, which is the whole reason it is here rather than
# a hand-written matcher or a backtracking one — see the header above. The same crate
# `slopdesk-workspace` already takes for the secret shapes and `slopdesk-screend` for the detection
# ladder, so this adds a version to the lock file and nothing to the tree.
regex = "1"

# Both scans run on a keystroke, so this is a latency-shaped library rather than the hook's
# startup-tuned profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml` and every sibling. A literal copy rather than
# an inherited table because this is a standalone workspace: there is no parent to inherit from.
# ---------------------------------------------------------------------------- #

[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dev-dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
