# `slopdesk-screend` — the terminal SCREEN service: raw PTY bytes in, a rendered screen out.
#
# ## Why this is its OWN workspace, sitting inside `rust/`
# The same reason `slopdesk-superd` is (see its Cargo.toml): cargo profiles are workspace-global,
# and the hook's release profile — `opt-level = "z"`, `panic = "abort"`, `lto = true` — is tuned
# for a binary forked twice per tool call, where startup time is the whole cost.
#
# screend wants the opposite on both counts. It is a long-lived daemon whose entire job is a
# per-byte loop (`opt-level = "z"` measurably slows a state machine like this one), and a panic on
# one connection's thread must take that connection and nothing else: a malformed request from one
# pane cannot be allowed to blank every other pane's detection. Neither setting is expressible
# per-package, so the two cannot share a profile, so they cannot share a workspace.
[workspace]
resolver = "3"

[package]
name = "slopdesk-screend"
version = "0.1.0"
edition = "2024"
publish = false
description = "Terminal screen service for slopdesk — VT screen model + cold-reattach snapshot renderer"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-screend"
path = "src/main.rs"

[lib]
name = "slopdesk_screend"
path = "src/lib.rs"

[dependencies]
# The replay passes and the byte scanners they are written in. They left this crate when the host
# stopped needing a socket to reach them; screend reads them back through the same crate the app
# links, so there is one implementation rather than a daemon copy and an app copy.
slopdesk-sanitize = { path = "../slopdesk-sanitize" }
# The wire, which left this crate for `slopdesk-sanitize`'s reason: two callers, one implementation.
# The client end is hostd's, and while the wire lived here the only way to reach it was to BE the
# daemon — so hostd hand-wrote a second copy in Swift. Both ends still sit in one crate, so the
# round trip is still a test rather than an agreement kept by review.
slopdesk-screenwire = { path = "../slopdesk-screenwire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The detection rule ladder runs untrusted PTY output through manifest patterns. `regex` is a
# finite automaton with a documented linear-time guarantee — the reason the ladder moved off
# `NSRegularExpression`, whose ICU backtracking has no such bound on an adversarial line.
regex = "1"
# Manifests are TOML. Swift had no TOML, so the original hand-wrote a subset parser; here the
# canonical crate reads the same files upstream's own engine does. `display` is off — this end
# only ever parses.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# The per-byte loop IS the product — this is the one binary in the tree where throughput is the
# reason it exists at all (the Swift original it replaces ran at 18 MiB/s).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml`, with the deviations this daemon's job
# forces. A literal copy rather than inherited, because inheriting would mean being a member,
# which is the thing the profile forbids.
[lints.rust]
# `forbid`, not `deny` (stage 28): this crate has never contained an `unsafe` block, and `forbid`
# is what turns that from a fact about today's code into one no downstream `allow` can undo. Every
# syscall with no safe wrapper lives in `slopdesk-posix`; if this daemon ever needs one, it depends
# on that crate rather than lifting the lint here.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `indexing_slicing`: a terminal grid IS an indexed structure, and every coordinate reaching it
#   has already been clamped by `clamp_row`/`clamp_col` or a `min` against `cols`. Rewriting ~200
#   grid touches as `get_mut(..)` + `else { return }` would replace one panic that cannot fire
#   with a hundred silent no-ops that hide the bug if it ever could. The clamps are the check.
indexing_slicing = "allow"
# - `print_stderr`: stderr IS screend's log, exactly as it is superd's — launchd/hostd captures it,
#   and routing it through a logging crate would add a dependency to say the same words.
print_stderr = "allow"
# - `multiple_crate_versions` (cargo): a duplicate deep in serde's tree is not ours to resolve.
multiple_crate_versions = "allow"
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
