# `slopdesk-screenwire` — the screend wire: one length-prefixed request, one length-prefixed reply.
#
# ## Why it is its own crate rather than part of screend
# `slopdesk-sanitize`'s reason, exactly: two callers, one implementation. screend decodes a request
# and encodes a reply; hostd encodes the request and decodes the reply. Both ends were already in
# screend's `protocol.rs` — and the host's end was ALSO hand-written a second time in Swift, because
# the only way to reach the Rust one was to be the daemon. That is the same accident that kept the
# replay passes behind a socket until they became this crate's neighbour.
#
# Splitting it out is what lets the app link the wire without linking the ENGINE. screend's crate
# carries `regex`, `toml`, `serde` and a per-byte screen model, none of which the client end needs
# and none of which belongs in an iOS binary — the whole point of screend being a daemon is that the
# app does not parse screens.
#
# Both ends stay together HERE, which is the property `docs/DECISIONS.md` recorded when the client
# end moved into Rust: with encode and decode in one crate the round trip is a TEST, not an
# agreement two files keep by review.
#
# ## Why it is its OWN workspace
# Same reason `slopdesk-sanitize` is: cargo profiles are workspace-global. This is linked into the
# app through `slopdesk-ffi`, whose `panic = "abort"` is a soundness requirement (unwinding across a
# C ABI frame is undefined), and into screend, whose `panic = "unwind"` keeps one bad connection
# from blanking every pane. Neither is expressible per-package.
#
# ## No dependencies, on purpose
# A length prefix, four integers and a `split_at_checked` are std's whole job description here, and
# every byte this decodes arrived over a socket. `slopdesk-dropd`'s frame layer says the same thing
# for the same reason.
[workspace]
resolver = "3"

[package]
name = "slopdesk-screenwire"
version = "0.1.0"
edition = "2024"
publish = false
description = "The screend wire for slopdesk — request/reply framing shared by the daemon and its client"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_screenwire"
path = "src/lib.rs"

[dependencies]

# Linked into the app AND into a daemon whose whole job is a per-byte loop.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml`. A literal copy rather than inherited, because
# inheriting would mean being a member, which is the thing the profile forbids.
[lints.rust]
# `forbid`, not `deny`: this crate is a framing layer over untrusted socket bytes and has never
# contained an `unsafe` block. Every syscall with no safe wrapper lives in `slopdesk-posix`.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with reasons:
# - `multiple_crate_versions` (cargo): zero dependencies, so it can only ever fire on a
#   toolchain artefact outside our control.
multiple_crate_versions = "allow"
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
