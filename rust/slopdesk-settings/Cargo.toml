# `slopdesk-settings` — what slopdesk can be configured to do, as data.
#
# ## Why it is its own crate
# The configuration surface: every key the file may carry, its domain, its default and its sentence,
# the resolver that reads a file against them, the JSON Schema written out of them, and the two
# projections the window chrome switches between. It decides nothing — a change here changes a
# default or a range, never a behaviour — and it was sitting in the same crate as the tree
# operations, which is how the workspace document's domain rules came to be a dependency of
# anything that wanted to know a default.
#
# ## Why it is nearly a leaf
# Two dependencies, each earned by the config FILE: `toml` parses it, and `slopdesk-terminal` owns
# the control vocabularies a choice key must not respell. Nothing in here reaches for a pane, a tab
# or a session — a table that needed one would not be a table.

[workspace]
resolver = "3"

[package]
name = "slopdesk-settings"
version = "0.1.0"
edition = "2024"
publish = false
description = "The configuration surface for slopdesk — the key table, the file resolver and its JSON Schema"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_settings"
path = "src/lib.rs"

[dependencies]
# The config file is a real TOML document, so it is parsed by the ecosystem's parser rather than by
# a hand-rolled line reader of ours. `screend` already carries this dependency for the same reason.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# The control vocabularies — the clipboard gates, the mouse verbs, the two link verbs — already live
# there, and a choice key must offer exactly the tokens the terminal accepts. Referencing `token()`
# in const context is what keeps the config file from accepting a word nothing downstream knows.
slopdesk-terminal = { path = "../slopdesk-terminal" }

# Settings is not a hot path, but the profile is shared with its callers so a mixed build does not
# recompile the tree twice.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml` and `rust/slopdesk-wire/Cargo.toml`. A literal
# copy rather than inherited, because inheriting would mean being a member, which is what the
# profile above forbids.
#
# `unsafe_code` is FORBID, not deny, and here it is the POINT rather than a nicety: this is the code
# the Swift side could only make fast by leaving safety, and forbid — unlike deny — cannot be
# re-allowed downstream by whoever later wants a SIMD kernel.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dev-dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never
#   `addingProduct`/`fma`)". FMA rounds once where the wire rounds twice, so taking the lint's
#   advice changes the very `f64` bit patterns `golden/golden_vectors.json` pins. Crate-wide
#   rather than per-site because every geometry expression would otherwise carry the same
#   `#[expect]` and the reason is a repo invariant, not a local judgement.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
