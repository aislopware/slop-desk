# `slopdesk-superd` — the custodian of every long-lived child process.
#
# ## Why this is its OWN workspace, sitting inside `rust/`
# Cargo profiles are workspace-global, and three of the settings the hook's release profile
# depends on cannot be overridden per-package (`panic`, `lto`, and friends are rejected in
# `[profile.release.package.*]`). The hook wants `panic = "abort"`: it is forked twice per tool
# call and a panic there is a broken agent turn, so aborting immediately is right.
#
# superd wants the exact opposite. It holds the master fd of every live pane. A panic on one
# pane's reaper thread must kill that thread and nothing else — `panic = "abort"` would turn a bug
# in one pane's bookkeeping into the loss of every running agent, which is the entire failure mode
# this daemon exists to remove. That is not a preference, so the two cannot share a profile, so
# they cannot share a workspace.
#
# The knock-on cost is real and paid in the justfile: `lint-rust`, `hook`, and `hook-test` all need
# a sibling invocation here, because `cd rust && cargo clippy --workspace` does not reach an
# excluded directory.
[workspace]
resolver = "3"

[package]
name = "slopdesk-superd"
version = "0.1.0"
edition = "2024"
publish = false
description = "Custodian for slopdesk's long-lived children — owns PTYs and panel backends across a hostd restart"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[[bin]]
name = "slopdesk-superd"
path = "src/main.rs"

[lib]
name = "slopdesk_superd"
path = "src/lib.rs"

[dependencies]
# One codec for both directions: `blocks` encodes retained output into the JSON reply, `sniffer`
# decodes kitty's `e=1` notification payloads. Both were twenty hand-written lines agreeing with
# each other by inspection; they read the same `STANDARD` engine now.
base64 = "0.23"
libc = "0.2"
# The whole of superd's `unsafe`, extracted (stage 28). A linked library rather than a socket
# because a syscall cannot be asked for over a wire: it is lifetime-coupled to its caller by
# definition, which is `CLAUDE.md`'s test for which shape a port takes.
slopdesk-posix = { path = "../slopdesk-posix" }
# The control socket's LAYOUT, which hostd reads and this daemon writes. Its own crate for
# `slopdesk-screenwire`'s reason: it was spelled here AND in Swift, and the app must be able to link
# the framing without linking `nix`, `base64` and a PTY supervisor with it.
slopdesk-superwire = { path = "../slopdesk-superwire" }

# The shared byte scanners over text a foreign program wrote. The `133;E` shim unescaping and the
# percent decoding were spelled here AND in that crate, which is where they belong: `escape` sits
# beside `vtscan` and `width` for the same reason those do.
slopdesk-sanitize = { path = "../slopdesk-sanitize" }
# Where a front-truncated stream was w.r.t. the alternate screen — the journal's compaction repair.
# Its own crate rather than `slopdesk-wire`'s module, because superd must not depend on the protocol
# to find out what a byte means. See `rust/slopdesk-altscreen/Cargo.toml`.
slopdesk-altscreen = { path = "../slopdesk-altscreen" }
nix = { version = "0.31", features = ["fs", "hostname", "ioctl", "poll", "process", "signal", "socket", "term", "uio"] }
# `serde_json` and NOT `serde`: every reply this daemon writes is built with `serde_json::to_vec`
# over a value it assembles. Nothing here derives — the hand-written `Serialize` impls that
# `sniffer.rs` and `blocks.rs` remember went with the types when those moved to
# `slopdesk-superwire` — so the derive crate was a dependency no source named. See
# `rust/slopdesk-androidd/Cargo.toml`, which carried the same one for the same reason.
serde_json = "1"

# TEST-ONLY, and the boundary is the point: superd does not know the protocol and must not. The
# frozen `hostOutputSniffer` corpus pins "these PTY bytes produce these FRAMES", which no single
# crate can check, so the guard that replays it (`tests/golden_sniffer.rs`) borrows the encoder here
# and nowhere else.
[dev-dependencies]
slopdesk-wire = { path = "../slopdesk-wire" }
# `winsize-set` on superd's DEV dependency and nowhere else in superd. superd may not issue
# `TIOCSWINSZ` (`docs/51` §6.9) — hostd owns it — but superd's tests must stand in for hostd to
# check that the resize verb records a truthful size. Enabling the feature here alone means
# `cargo build --release` does not compile the setter into the daemon at all, so the rule is a link
# error rather than a review comment.
#
# The one crate that enables it for REAL is `slopdesk-hostpane`, which is hostd's half of a pane and
# therefore the one writer the rule names. Two enablers, and the split between them is the rule
# itself: dev-only where the ioctl is a stand-in, non-dev where it is the job.
slopdesk-posix = { path = "../slopdesk-posix", features = ["winsize-set"] }

# A long-lived daemon, not a hot path — optimise for the debugger being useful when something goes
# wrong at 3am, not for binary size.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
# DEVIATION 2, and THE reason this is a separate workspace. See the header.
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml`, with the two deviations superd's job
# forces. Kept as a literal copy rather than inherited, because inheriting would mean being a
# member, which is the thing the profile forbids.
[lints.rust]
# NO LONGER A DEVIATION (stage 28). superd used to sit at `deny` for one reason: the window between
# `fork(2)` and `execve(2)`, plus four smaller syscalls with no safe wrapper. `deny` is liftable by
# a single `#[allow]` anywhere in eleven thousand lines, so the exception was crate-wide in effect
# even though it was one module in intent. Those five sites are `slopdesk-posix` now, and what is
# left here cannot contain unsafe code at all — `forbid` is not a promise, it is a proof.
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# DEVIATION 1: `print_stderr`. stderr IS superd's log — launchd captures it to `StandardErrorPath`
# and that file is the only record of why a pane died. Routing it through a logging crate would add
# a dependency to say the same words. The deviation is FOUR files, not the crate, so each carries
# its own `#![expect]` — `server`, `listeners`, `registry`, `journal` — and this stays denied so a
# fifth has to be a decision.
print_stderr = "deny"
# - `multiple_crate_versions` (cargo): unlike the hook, superd has real dependencies, and a
#   duplicate deep in nix's or serde's tree is not ours to resolve.
multiple_crate_versions = "allow"
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins. Allowed in EVERY workspace, not only the ones doing float
#   math today: the reason is a repo invariant, and a lint that fires the first time a float lands
#   here would be obeyed before anyone reads this file.
suboptimal_flops = "allow"
imprecise_flops = "allow"
