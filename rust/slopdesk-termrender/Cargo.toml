[package]
name = "slopdesk-termrender"
version = "0.1.0"
edition = "2024"
publish = false
description = "Everything between a terminal frame and a draw call, with no GPU and no font engine"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_termrender"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dev-dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids. This crate is the most geometry-dense in the tree,
#   so it is also the one where following that advice would do the most damage.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"

[dependencies]
# The frame this crate draws. A one-way dependency: `slopdesk-vterm` knows nothing about pixels, and
# every type crossing this edge is plain owned data, which is what makes a renderer test runnable
# with no engine attached.
slopdesk-vterm = { path = "../slopdesk-vterm" }

# `geometry::{CellMetrics, Rect, rect, clamped_rect}` — where a cell span draws. That module's own
# header records it as the single source of truth the underline overlay, the hint labels and the
# hit-test all measure against, and a second spelling of `origin + cell_width * col` here would be
# exactly the drift class it was written to close.
slopdesk-terminal = { path = "../slopdesk-terminal" }

# Drawing is the budget (docs/68 §6), so this crate gets a throughput profile rather than the
# workspace's startup-tuned one. It is linked into a long-lived app, never forked per event.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
