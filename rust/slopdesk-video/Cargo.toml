# `slopdesk-video` — the PATH-2 video protocol: forward error correction first.
#
# ## Why a second crate rather than a module of `slopdesk-wire`
# `slopdesk-wire` is the PATH-1 TERMINAL codec: framing, the message table, the mux. This is PATH-2,
# a different transport with a different owner (the video host, not hostd's PTY loop) and a
# different failure model — a corrupt terminal frame fails the session, a corrupt datagram is
# dropped and the frame is repaired. Folding them together would put a Reed-Solomon field on the
# dependency path of every `WireMessage` encode for no reason. Same workspace-isolation argument as
# the daemons: profiles are workspace-global and this one wants `opt-level = 3`.
#
# ## Resurrected, not invented
# `Sources/SlopDeskVideoProtocol/GF256.swift` says so in its own header: it is "the resurrected,
# native-Swift port of the Rust `slopdesk-core::gf256` reference". So this stage runs that sentence
# backwards. `a2b51614^` holds `rust/aislopdesk-core/src/{gf256,rs_matrix,fec}.rs` — 1,781 lines,
# `#![forbid(unsafe_code)]`, zero dependencies — and they come back from there rather than being
# retyped out of the Swift that was typed out of them.
#
# ## What the port is FOR here, beyond speed
# The Swift FEC path is the least safe code in the tree: `NeonGf` reaches through a C target
# (`Sources/CSlopDeskSIMD`) with `UnsafeBufferPointer`, `withUnsafeTemporaryAllocation` and a
# `swiftlint:disable force_unwrapping`, and both the encoder and the decoder hand raw
# `UnsafeMutableBufferPointer` accumulators around. Every one of those is a memory-safety hazard on
# a path that parses hostile network bytes, and every one of them is gone: this crate is
# `forbid(unsafe_code)`, so the category is deleted rather than reviewed again.
#
# ## Where the kernel went
# The port was first attempted WITHOUT a vector kernel at all, on the theory that safe Rust would
# hold parity. It did not — twice, by a factor of two, and the second attempt (a bitsliced `u64`
# multiply) was within noise of the first. The kernel therefore came back, but as ONE dependency,
# `slopdesk-gfsimd`, holding the two byte-region loops and nothing else. That crate is `deny` with
# a per-site `#[expect]`; this one stays `forbid`, which is the arrangement the whole split is for
# — the field arithmetic, the matrices, the codec and the network parsing are all still provably
# free of unsafe code, and what is left to audit is a page. `docs/DECISIONS.md` has the numbers.
[workspace]
resolver = "3"

[package]
name = "slopdesk-video"
version = "0.1.0"
edition = "2024"
publish = false
description = "PATH-2 video protocol for slopdesk — GF(2^8), Reed-Solomon erasure coding, FEC"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_video"
path = "src/lib.rs"

[dependencies]
# The one dependency, and the reason it is worth having: see that crate's header.
slopdesk-gfsimd = { path = "../slopdesk-gfsimd" }

[dev-dependencies]
# Only the golden-parity test reads JSON. The library itself stays dependency-free.
serde_json = "1"

# FEC runs per video frame at 60 fps with the encoder already spending the budget.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml` and `rust/slopdesk-wire/Cargo.toml`. A literal
# copy rather than inherited, because inheriting would mean being a member, which is what the
# profile above forbids.
#
# `unsafe_code` is FORBID, not deny, and here it is the POINT rather than a nicety: this is the code
# the Swift side could only make fast by leaving safety, and forbid — unlike deny — cannot be
# re-allowed downstream by whoever later wants a SIMD kernel.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dev-dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never
#   `addingProduct`/`fma`)". FMA rounds once where the wire rounds twice, so taking the lint's
#   advice changes the very `f64` bit patterns `golden/golden_vectors.json` pins. Crate-wide
#   rather than per-site because every geometry expression would otherwise carry the same
#   `#[expect]` and the reason is a repo invariant, not a local judgement.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
