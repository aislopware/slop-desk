# `slopdesk-videohostd` — the GUI video path (PATH 2) host daemon, in Rust.
#
# ## Why a crate rather than a target inside `slopdesk-video`
# `slopdesk-video` is the RULES: ninety modules of pure decisions, `forbid(unsafe_code)`, and a test
# suite that needs no window server. It is linked from both ends of the wire — the host that
# encodes and the client that decodes — and the moment a daemon lives inside it, the temptation is
# to reach for a socket or a `SCStream` from inside a rule. This crate is the one that is allowed to
# have effects: it opens the two UDP sockets, starts the capture, drives the encoder, parks a window
# on the virtual display, and injects what comes back. Every verdict it takes it ASKS for.
#
# ## The shape it is replacing
# `Sources/SlopDeskVideoHost` (47 files, ~7100 code lines) plus `Sources/slopdesk-videohostd`
# (~1800). Both were already faces: 33 of the 47 files import `CSlopDeskFFI` and the decisions they
# reach through it are the modules of `slopdesk-video` listed below. What was genuinely Swift was
# the THREADING — the actor, the dispatch queues, the `NWConnection` — and that is what this crate
# writes natively instead of reaching for through a door. A Rust daemon calling
# `slopdesk-apple-sck` and `slopdesk-apple-vt` directly needs no FFI door at all, so this port
# DELETES header surface rather than adding it.
#
# ## Its own `[workspace]`, for the reason its siblings have one
# `rust/Cargo.toml`'s members are the FORK-PER-EVENT programs and share a startup-tuned
# `opt-level = "z"`. A daemon on the frame budget wants a daemon's profile. The cost is the one
# every host crate pays: `cargo -p` from the root cannot reach it, and its gate is
# `cd rust/slopdesk-videohostd && cargo test`.

[workspace]
resolver = "3"

[package]
name = "slopdesk-videohostd"
version = "0.1.0"
edition = "2024"
publish = false
description = "the SlopDesk GUI-video host daemon: capture, encode, packetize, serve, inject"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_videohostd"
path = "src/lib.rs"

# The daemon itself: an ORDER over the library above, and nothing else.
[[bin]]
name = "slopdesk-videohostd"
path = "src/main.rs"

[dependencies]
# Every decision this daemon takes about a frame, a packet or a window. Ninety modules already
# holding the whole rule set — the packetizer, the FEC, the mux header and routing, the congestion
# controller, the QP ladder, the LTR machine, the FPS governor, the capture gates, the geometry.
# This crate adds no rule of its own; where it looks like one, it belongs there instead.
slopdesk-video = { path = "../slopdesk-video" }

# Where the launch record — and therefore `video-prefs.json` beside it — lives. Asked rather than
# spelled: the Application Support path is already one implementation, and hostd folds the SAME file
# from the SAME directory.
slopdesk-hostlaunch = { path = "../slopdesk-hostlaunch" }

# The ONE spelling of "a number as a user would have typed it". `EnvBridge.formatDouble` crossed the
# FFI boundary to reach this exact function; a Rust daemon links it instead.
slopdesk-terminal = { path = "../slopdesk-terminal" }

# The settings sidecar this daemon folds at launch. `serde` reads it; nothing here writes one.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The window server's own answer to "what is shareable". This daemon is the only caller that needs
# the whole enumeration — the two lookups by id were all the capture path ever asked for.
slopdesk-apple-sck = { path = "../slopdesk-apple-sck" }

# The VideoToolbox compression session, its timestamps and its pixel buffers, as safe Rust — and,
# since the Swift half was deleted, the ENCODER DRIVER's only framework edge. The driver lived in
# `slopdesk-ffi` for as long as the C doors did, because the SDK publishes HEVC parameter sets as a
# bare pointer and the `slice::from_raw_parts` that laid them in front of a slice had to be written
# by a crate allowed one. `EncodedSample::copy_parameter_sets_into` moved that read to the framework
# side under `docs/57` §2's sample-memory amendment, so `src/encode.rs` holds the driver, this crate
# stays `forbid(unsafe_code)`, and the shim edge that `docs/61` §2 registered as debt is GONE.
slopdesk-apple-vt = { path = "../slopdesk-apple-vt" }

# The window feed's four framework edges. The census (`cgwindow`) is the feed's spine; the display
# list (`cgdisplay`) turns a frame into an ordinal; the app reads (`app`) answer a bundle id and a
# hidden flag per pid; the accessibility tree (`ax`) is the only thing on macOS that can tell a
# minimized window from a ghost the server still lists. All four are `objc2`-only wrappers — this
# crate stays `forbid(unsafe_code)`.
slopdesk-apple-cgwindow = { path = "../slopdesk-apple-cgwindow" }
slopdesk-apple-cgdisplay = { path = "../slopdesk-apple-cgdisplay" }
slopdesk-apple-app = { path = "../slopdesk-apple-app" }
slopdesk-apple-ax = { path = "../slopdesk-apple-ax" }

# Remote input's one effect: every pointer, scroll, key and text event the client sends is built and
# posted through this crate. It is the last framework edge the daemon needed — with it, the whole
# input path from the wire to the window server is Rust and the injector's orchestration lives beside
# the session that drives it rather than across a language boundary from it.
slopdesk-apple-cgevent = { path = "../slopdesk-apple-cgevent" }

# The cursor's own channel. `NSCursor` is a window-server read on the MAIN thread, which is why the
# sampler hops for the shape and never for the position — the two are different framework areas and
# the crate wraps only the one.
slopdesk-apple-cursor = { path = "../slopdesk-apple-cursor" }

# The other half of the same channel, and a different framework area: where the pointer IS, in the
# global Cocoa points the position math takes. Off the main thread by design — that is the whole
# reason the sampler can run at 120 Hz behind a main thread doing accessibility round-trips.
slopdesk-apple-nsevent = { path = "../slopdesk-apple-nsevent" }

# The sleep assertion a full-desktop session holds. `IOPMAssertion` is a refcount the daemon owns
# process-wide, so the crate wraps the assertion and this one holds the count.
slopdesk-apple-power = { path = "../slopdesk-apple-power" }

# The virtual display a parked window lives on. Private `CGVirtualDisplay` classes, probed rather
# than assumed — the wrapper answers whether they resolved at all.
slopdesk-apple-cgvirtualdisplay = { path = "../slopdesk-apple-cgvirtualdisplay" }

# This process's own application object, and the main event loop it runs. Capture refuses to start
# in a process with no window-server connection (`CGS_REQUIRE_INIT`), and the virtual display
# dispatches to the MAIN QUEUE — so `main` ends in a real loop, never a park.
slopdesk-apple-nsapp = { path = "../slopdesk-apple-nsapp" }

# One syscall with no safe wrapper: `machdep.cpu.brand_string`, which places the running chip on
# the framebuffer-limit ladder the virtual display's geometry is refused or granted by.
slopdesk-posix = { path = "../slopdesk-posix" }

# The shutdown signals, blocked before any thread exists and waited on rather than handled — the
# discipline `slopdesk-hostd`'s own `main` argues at length.
nix = { version = "0.31", features = ["signal"] }

# The second stream `ScreenCaptureKit` already delivers. The AAC converter it wraps is `!Send` by
# design, which is why `src/audio.rs` confines it to one thread rather than locking it.
slopdesk-apple-audio = { path = "../slopdesk-apple-audio" }

[dev-dependencies]

# The daemon's own profile — every byte a client sees crosses this process, on the frame budget.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# The maximal-strict set every sibling carries, copied rather than inherited for the same reason
# they copy it: inheriting means membership, and membership means sharing a profile.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason: both want `f64::mul_add`, the fused multiply-add `CLAUDE.md` forbids —
# FMA rounds once where the wire rounds twice, which moves the bit patterns the golden vectors pin.
# The transitive graph under this crate is the whole video family at once, and the lint prices that
# graph rather than this manifest — the same allow every sibling carries for the same reason.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
