# `slopdesk-videolink` — the CLIENT half of PATH 2's shared UDP flow, as sockets and threads.
#
# ## Why it is its own crate
# `slopdesk-video` is PATH 2's RULES — the header codec, the flow table, the lane pool, the FEC
# field. It is `forbid(unsafe_code)`, performs no I/O, and every function in it is a fold a test can
# drive without a machine. A `UdpSocket` and two reader threads inside it would end that property
# for the whole crate, which is the same line `slopdesk-devicelink` draws against
# `slopdesk-devicepanel`.
#
# The HOST half already lives this way: `rust/slopdesk-videohostd`'s `mux_transport` is two sockets
# and three threads over `slopdesk_video::{mux_flow, mux_routing}`. This crate is its mirror, so the
# one wire has one implementation on each end and neither is Swift.
#
# ## What it replaces
# `Sources/SlopDeskVideoClient/Mux/NWVideoMuxClientFlow.swift` — the last `NWConnection` on the
# video path. Everything it decided was already Rust behind a door (`slopdesk_mux_*`); what was
# Swift was the socket, the receive re-arm and the lane sink table.
[workspace]
resolver = "3"

[package]
name = "slopdesk-videolink"
version = "0.1.0"
edition = "2024"
publish = false
description = "The client's shared UDP media + cursor flow: two sockets, two readers, one lane table"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_videolink"
path = "src/lib.rs"

[dependencies]
# The wire and the loop rules, both already pinned by their own suites: `mux_header` frames every
# datagram this crate sends and parses every one it receives, and `mux_flow`'s `receive_backoff` is
# the ladder that keeps a sustained ICMP unreachable from becoming a busy loop.
slopdesk-video = { path = "../slopdesk-video" }

# Linked into the app; the hot path is one header parse per datagram at 60 Hz × N lanes.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"

# ---------------------------------------------------------------------------- #
# The strict block, copied rather than inherited — inheriting would mean being a workspace member,
# which is what the profile forbids.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly the
#   fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never `addingProduct`/`fma`)".
#   FMA rounds once where the wire rounds twice, so taking the advice changes the `f64` bit patterns
#   `golden/golden_vectors.json` pins.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
