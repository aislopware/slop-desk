[package]
name = "slopdesk-vterm"
version = "0.1.0"
edition = "2024"
publish = false
description = "The terminal engine for slopdesk — parse, grid and scrollback, with no renderer"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_vterm"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dev-dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"

[dependencies]
# The renderer-agnostic half of ghostty, through the MIT Rust bindings. `rev` is pinned and MUST
# stay in step with the `ghostty` record in `ThirdParty/tools/tools.lock`: the bindings are
# generated against one ghostty commit, and the source tree `GHOSTTY_SOURCE_DIR` points at is what
# actually compiles. `just lint-invariants` holds the second half of that pair.
#
# A MIRROR, and only for soundness. `Uzaaft/libghostty-rs` builds a `&str` with `from_utf8_unchecked`
# over an OSC 52 payload — base64-decoded bytes any program in the pty picks — and slices a null
# pointer for the "clear the clipboard" shape. Upstream's own issue #75 tracks both and its PR #76
# added two `cfg(miri)` reproducers that FAIL; this rev is `f4c72b9` (their HEAD, reproducers and
# all) plus the one commit that flips them to pass: `String::to_bytes` guards the null,
# `ClipboardContent::data` is `&[u8]`, and `crate::events::preferred_text` decides whether those
# bytes are text. Nothing else diverges, so this goes home the moment #75 closes — the branch is the
# upstreamable commit, not a maintained divergence. The bindings are still generated against ghostty
# `22d13172`, so no engine bump rides along with it.
#
# Hosted in the same ORG as this project rather than a personal account: a build dependency that only
# one person can administer is a bus factor in the build itself — a deleted or renamed account takes
# the tree red with it, and `rev` pinning does not protect against the remote going away. The mirror
# carries upstream's full history and every ref, so it is a superset of what it replaces.
libghostty-vt = { git = "https://github.com/aislopware/libghostty-rs", rev = "519649e" }

# The kitty graphics protocol's `f=100` transmission. `libghostty-vt` decodes no PNG itself — it
# publishes a HOOK and declines the format when nothing is installed, because an engine does not
# choose an image library for its embedders. `crate::graphics::PngDecoder` is the four lines that
# fill it. The bindings' own optional `RustPngDecoder` is NOT taken and could not be: it reserves
# CAPACITY into a `Vec` and hands the `Vec` to `next_frame`, which reads its LENGTH, so the buffer
# it passes is always empty and every decode fails.
png = "0.18"

# The find bar's regex mode. Linear-time by construction, which is the whole reason it is here
# rather than a backtracking engine: a ⌘F pattern is re-run over the entire retained buffer on every
# keystroke, and one pathological pattern must not be able to freeze the bar. The same crate
# `slopdesk-rowscan`, `slopdesk-workspace` and `slopdesk-screend` already take, so this adds a
# version to the lock file and nothing to the tree.
regex = "1"

[dev-dependencies]
# The kitty graphics protocol carries its payload base64-encoded inside an APC, so a test that
# proves an image round-trips has to speak it. Tests only: nothing in the shipped crate encodes.
base64 = "0.23"

[workspace]
