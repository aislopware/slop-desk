[package]
name = "slopdesk-vterm"
version = "0.1.0"
edition = "2024"
publish = false
description = "The terminal engine for slopdesk — parse, grid and scrollback, with no renderer"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_vterm"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dev-dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"

[dependencies]
# The renderer-agnostic half of ghostty, through the MIT Rust bindings. `rev` is pinned and MUST
# stay in step with the `ghostty` record in `ThirdParty/tools/tools.lock`: the bindings are
# generated against one ghostty commit, and the source tree `GHOSTTY_SOURCE_DIR` points at is what
# actually compiles. `just lint-invariants` holds the second half of that pair.
#
# A FORK, and only for soundness. `Uzaaft/libghostty-rs` builds a `&str` with `from_utf8_unchecked`
# over an OSC 52 payload — base64-decoded bytes any program in the pty picks — and slices a null
# pointer for the "clear the clipboard" shape. Upstream's own issue #75 tracks both and its PR #76
# added two `cfg(miri)` reproducers that FAIL; this rev is `f4c72b9` (their HEAD, reproducers and
# all) plus the one commit that flips them to pass: `String::to_bytes` guards the null,
# `ClipboardContent::data` is `&[u8]`, and `crate::events::preferred_text` decides whether those
# bytes are text. Nothing else diverges, so this goes home the moment #75 closes — the fork's branch
# is the upstreamable commit, not a maintained divergence. The bindings are still generated against
# ghostty `22d13172`, so no engine bump rides along with it.
libghostty-vt = { git = "https://github.com/trancong12102/libghostty-rs", rev = "519649e" }

[workspace]
