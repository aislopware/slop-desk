# `slopdesk-workspace` — the workspace document's DOMAIN rules.
#
# ## Why a third crate rather than a module of `slopdesk-wire`
# `slopdesk-wire` already carries the workspace CHANNEL: the subscribe/ack/intent envelopes, the
# document's flat cell codec, and the intent argument payloads. What it deliberately does not carry
# is what those intents MEAN — where a dropped pane lands, which divider a resize moves, what a
# split does to a tree. That is this crate. The split is the same one the wire itself draws: the
# codec says what a message looks like, the domain says what it does.
#
# ## Why it is worth moving at all
# `Sources/SlopDeskWorkspaceModel` is the largest body of PURE logic left in Swift — tree ops,
# canvas snapping, non-overlap resolution, topology — with no AppKit and no SwiftUI anywhere in it,
# which by the repo's own rule means there is nothing keeping it in Swift. It is also the layer a
# network peer now reaches through the workspace channel, so `forbid(unsafe_code)` and the
# indexing_slicing / panic denials are doing real work here rather than ceremony.

[workspace]
resolver = "3"

[package]
name = "slopdesk-workspace"
version = "0.1.0"
edition = "2024"
publish = false
description = "The workspace document's domain rules for slopdesk — canvas, tree and topology"
license = "MIT"
repository = "https://github.com/aislopware/slop-desk"

[lib]
name = "slopdesk_workspace"
path = "src/lib.rs"

[dependencies]
# The one matcher every search field in the app scores against. `src/search_rank.rs` decides the
# ORDER a list comes back in, and the order is a fact about the scores — a ranking that scored
# with a second matcher would put the palette and the fuzzy tests in different orders.
slopdesk-fuzzy = { path = "../slopdesk-fuzzy" }

# The secret shapes. `src/secrets.rs` scans text a remote shell wrote — a title, a notification
# body, a clipboard — for credential patterns published as regular expressions, which is the
# notation they should stay in: a new vendor prefix is then one line, not a new byte loop to review.
# Same crate and same reason as `slopdesk-screend`: a finite automaton with a documented
# linear-time guarantee, where ICU's backtracking has no such bound on a line an adversary chose.
regex = "1"

# UAX-29 grapheme clusters, for `src/keystroke_replay.rs` and NOTHING else. Swift iterates a
# `String` as `Character`s — extended grapheme CLUSTERS — and the port must, because the caller
# feeds it a clipboard and the sink is a `sudo` password field. `chars()` would walk SCALARS, so a
# decomposed "é" (`e` + U+0301) would type a bare `e` and drop the accent as unmappable, turning a
# password into a DIFFERENT password that the user watches be accepted. The rule the table encodes
# is "a cluster maps only when it is one ASCII byte", and deciding where one cluster ends is the
# standard's job, not a byte loop's — hand-rolling the break table is the second implementation of
# a spec, with a silent-corruption failure mode.
unicode-segmentation = "1"

# The layout ops run on every drag frame with a live terminal reflow behind them.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "debuginfo"

# ---------------------------------------------------------------------------- #
# Same maximal-strict philosophy as `rust/Cargo.toml` and `rust/slopdesk-wire/Cargo.toml`. A literal
# copy rather than inherited, because inheriting would mean being a member, which is what the
# profile above forbids.
#
# `unsafe_code` is FORBID, not deny, and here it is the POINT rather than a nicety: this is the code
# the Swift side could only make fast by leaving safety, and forbid — unlike deny — cannot be
# re-allowed downstream by whoever later wants a SIMD kernel.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
integer_division = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
rest_pat_in_fully_bound_structs = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
lossy_float_literal = "deny"
try_err = "deny"

# Disabled, with a reason:
# - `multiple_crate_versions` (cargo): a duplicate deep in a dev-dependency's tree is not ours.
# - `suboptimal_flops` / `imprecise_flops` (nursery): both want `f64::mul_add`, which is exactly
#   the fused multiply-add `CLAUDE.md` forbids — "keep `a * b + c` separate (never
#   `addingProduct`/`fma`)". FMA rounds once where the wire rounds twice, so taking the lint's
#   advice changes the very `f64` bit patterns `golden/golden_vectors.json` pins. Crate-wide
#   rather than per-site because every geometry expression would otherwise carry the same
#   `#[expect]` and the reason is a repo invariant, not a local judgement.
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
